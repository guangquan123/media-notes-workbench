<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>多媒体笔记工作台 · 四页面简化优化原型</title>
  <style>
    :root { --ink:#16191d; --muted:#6e7782; --quiet:#9aa1a8; --line:#e6e7e7; --page:#f7f7f5; --surface:#fff; --accent:#3370ff; --accent-soft:#eef3ff; --shadow:0 10px 28px rgba(31,35,40,.07); }
    *{box-sizing:border-box} html,body{min-width:320px;min-height:100%;margin:0} body{color:var(--ink);background:var(--page);font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif} button,input{font:inherit} button{cursor:pointer}
    .page{min-height:100vh;padding:0 32px 20px}.shell{width:min(1440px,100%);margin:auto}.topbar{display:flex;height:72px;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
    .brand{display:flex;align-items:center;gap:12px}.brand-mark{display:grid;width:38px;height:38px;place-items:center;border-radius:11px;background:var(--accent);color:#fff;font-size:18px;font-weight:700}.brand-title{display:block;font-size:16px;font-weight:750;letter-spacing:-.03em}.brand-subtitle{display:block;margin-top:3px;color:var(--quiet);font-size:11px}.top-actions{display:flex;align-items:center;gap:10px}.status{display:none}.back{height:34px;padding:0 12px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--muted);font-size:12px}.back:hover{border-color:var(--accent);color:var(--accent)}
    .tabs{display:flex;gap:6px;padding:11px 0 9px;overflow-x:auto}.tab{display:inline-flex;flex:none;height:31px;align-items:center;gap:7px;padding:0 10px;border:1px solid transparent;border-radius:8px;background:transparent;color:var(--muted);font-size:12px;font-weight:700;white-space:nowrap}.tab:hover{background:#fff;color:var(--accent)}.tab.active{border-color:color-mix(in srgb,var(--accent),#fff 68%);background:var(--accent-soft);color:var(--accent)}.tab-mark{display:grid;width:17px;height:17px;place-items:center;border-radius:5px;background:color-mix(in srgb,var(--accent),#fff 83%);color:var(--accent);font-size:11px}
    .detail{display:grid;min-height:calc(100vh - 116px);grid-template-columns:minmax(0,1fr) minmax(560px,1fr);gap:72px;align-items:start;padding-top:32px}.intro{padding:0 0 16px 2px}.eyebrow{display:inline-flex;align-items:center;gap:7px;margin:0 0 12px;color:var(--accent);font-size:12px;font-weight:750}.eyebrow i{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent),transparent 86%)}.intro h1{max-width:560px;margin:0;font-size:clamp(2.9rem,3.25vw,3.5rem);line-height:1.12;letter-spacing:-.05em}.intro-copy{max-width:560px;margin:15px 0 0;color:var(--muted);font-size:16px;line-height:1.6}.steps{display:grid;max-width:600px;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-top:24px}.steps-6{grid-template-columns:repeat(6,minmax(0,1fr))}.step{min-width:0;min-height:86px;padding:12px 8px;border:1px solid var(--line);border-radius:14px;background:#fff;text-align:center}.step.active{border-color:color-mix(in srgb,var(--accent),#fff 55%);background:var(--accent-soft)}.step b{display:grid;width:23px;height:23px;margin:0 auto 8px;place-items:center;border-radius:50%;background:#f0f1f1;color:#8a929a;font-size:11px;font-weight:500}.step.active b{background:var(--accent);color:#fff}.step span{display:block;color:#7e8790;font-size:12px;line-height:1.35}.step.active span{color:var(--accent)}.trust{display:flex;flex-wrap:wrap;gap:14px;margin-top:17px;color:var(--quiet);font-size:11px}.trust b{margin-right:4px;color:#259467;font-size:13px}
    .panel{min-width:0;margin-top:0;padding:28px 30px 22px;border:1px solid var(--line);border-radius:22px;background:var(--surface);box-shadow:var(--shadow)}.panel-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding-bottom:15px;border-bottom:1px solid var(--line)}.panel-head h2{margin:0;font-size:21px;letter-spacing:-.04em}.panel-head p{margin:6px 0 0;color:var(--muted);font-size:13px;line-height:1.5}.panel-mark{display:grid;width:34px;height:34px;place-items:center;border-radius:10px;background:var(--accent);color:#fff;font-size:16px}.section-label{margin:18px 0 8px;color:#68717a;font-size:13px;font-weight:750}.drop-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.dropzone{display:flex;min-height:156px;align-items:center;justify-content:center;flex-direction:column;gap:8px;padding:13px;border:1px dashed #cfd3d6;border-radius:15px;background:#fbfbfa;text-align:center}.dropzone:hover{border-color:var(--accent);background:var(--accent-soft)}.drop-icon{display:grid;width:42px;height:42px;place-items:center;border-radius:11px;background:var(--accent);color:#fff;font-size:18px;font-weight:700}.dropzone strong{font-size:14px}.dropzone small{color:var(--quiet);font-size:12px;line-height:1.4}.dropzone.single{min-height:240px}.meta{display:flex;justify-content:space-between;gap:10px;margin-top:8px;color:var(--quiet);font-size:11px}.style-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.style{min-height:65px;padding:11px;border:1px solid var(--line);border-radius:10px;background:#fff;text-align:left}.style strong{display:block;font-size:14px}.style small{display:block;margin-top:5px;color:var(--quiet);font-size:12px}.style.active{border-color:var(--accent);background:var(--accent-soft)}.style.active strong{color:var(--accent)}.control{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;padding:11px 12px;border-radius:10px;background:#f7f7f5}.control span{color:var(--muted);font-size:12px}.segmented{display:flex;gap:4px}.segmented button{min-height:30px;padding:0 10px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--muted);font-size:11px}.segmented button.active{border-color:var(--accent);background:var(--accent);color:#fff}.toggle-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;padding:11px 12px;border-radius:10px;background:#f7f7f5}.toggle-row strong{display:block;font-size:12px}.toggle-row small{display:block;margin-top:4px;color:var(--quiet);font-size:11px}.toggle{width:35px;height:20px;padding:2px;border:0;border-radius:99px;background:#d9dde1}.toggle i{display:block;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .18s ease}.toggle.on{background:var(--accent)}.toggle.on i{transform:translateX(15px)}.footer{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:24px;padding-top:18px;border-top:1px solid var(--line)}.footer small{max-width:58%;color:var(--quiet);font-size:11px;line-height:1.45}.primary{min-height:46px;padding:0 17px;border:0;border-radius:9px;background:var(--accent);color:#fff;font-size:14px;font-weight:750;box-shadow:0 8px 18px color-mix(in srgb,var(--accent),transparent 78%)}.primary:hover{filter:brightness(.94)}.toast{position:fixed;right:23px;bottom:20px;display:none;padding:10px 13px;border:1px solid var(--line);border-radius:9px;background:#fff;box-shadow:var(--shadow);color:var(--muted);font-size:11px}.toast.show{display:block}
    @media(max-width:1040px){.page{padding-inline:22px}.detail{grid-template-columns:minmax(0,.88fr) minmax(500px,1.12fr);gap:28px}.intro h1{font-size:2.7rem}.panel{padding-inline:22px}}
    @media(max-width:820px){.page{padding-inline:15px}.topbar{height:60px}.status{display:none}.detail{display:block;min-height:0;padding-top:4px}.intro{padding:15px 0 17px}.intro h1{max-width:700px;font-size:2.15rem}.intro-copy{font-size:14px}.steps{display:flex;margin-top:17px;overflow-x:auto;padding-bottom:1px}.step{min-width:105px}.panel{margin-top:0}.footer{position:sticky;bottom:0;background:#fff}}
    .upload-label{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 6px}.upload-label strong{font-size:14px}.upload-hint{margin:0 0 7px;color:var(--quiet);font-size:12px;line-height:1.45}
    @media(max-width:560px){.page{padding-inline:12px}.brand-title{font-size:14px}.brand-subtitle{font-size:10px}.back{padding-inline:9px}.tabs{padding-top:8px}.panel{padding:16px 14px}.panel-head h2{font-size:18px}.drop-grid,.style-grid{grid-template-columns:1fr}.dropzone,.dropzone.single{min-height:145px}.footer{align-items:stretch;flex-direction:column}.footer small{max-width:none}.primary{width:100%}.intro h1{font-size:1.85rem}}
  </style>
</head>
<body>
  <main class="page"><div class="shell">
    <header class="topbar"><div class="brand"><span class="brand-mark" id="brandMark">▣</span><span><strong class="brand-title">本地视频工作台</strong><small class="brand-subtitle">上传、转录、总结、发布</small></span></div><div class="top-actions"><span class="status"><i></i>本地运行正常</span><button class="back" id="backBtn" type="button">← 返回入口</button></div></header>
    <nav class="tabs" id="tabs" aria-label="四个独立页面"></nav><section class="detail"><section class="intro" id="intro"></section><section class="panel" id="panel"></section></section>
  </div></main><div class="toast" id="toast" role="status"></div>
  <script>
    const pages={
      video:{key:'video',tab:'本地视频',mark:'▣',accent:'#e86f3d',soft:'#fff1eb',title:'把本地视频，变成一篇有结构的学习笔记。',copy:'上传课程、讲座或屏幕录制，系统会提取音轨、转录内容并整理成可复习的学习笔记。',steps:['安全上传','整理媒体','语音转文字','生成笔记','写入飞书'],source:'视频',hint:'最多 10 个视频，单个及累计均不超过 10 GB',action:'开始生成学习笔记 →'},
      paired:{key:'paired',tab:'双源会议 / 培训',mark:'✣',accent:'#4d5dff',soft:'#eef0ff',title:'把同一场内容的画面和声音，合成一份可核对的笔记。',copy:'上传主视频和辅助录音，系统会自动对齐两路声音，再结合画面生成可复核的会议笔记。',steps:['安全上传','提取音轨','时间对齐','双路转写','交叉验证','写入飞书'],source:'双源',hint:'主视频与辅助录音累计不超过 10 GB',action:'开始双源交叉验证 →'},
      recording:{key:'recording',tab:'录音文件',mark:'◉',accent:'#168b75',soft:'#e9f8f3',title:'让一段录音，沉淀成真正可复习的笔记。',copy:'上传课程录音、访谈或语音备忘，系统会转成文字、提炼重点，并整理成可复习的学习笔记。',steps:['安全上传','整理媒体','语音转文字','生成笔记','写入飞书'],source:'录音文件',hint:'支持 MP3、M4A、WAV、AAC、FLAC、OGG，最大 10 GB',action:'开始生成学习笔记 →'},
      document:{key:'document',tab:'文档学习',mark:'▤',accent:'#3370ff',soft:'#edf3ff',title:'把多份文档，沉淀成一篇可回顾的知识资产。',copy:'上传书籍、报告、论文或课程资料，系统会解析原文、提炼知识结构并保留可追溯依据。',steps:['安全上传','读取文件','解析原文','生成笔记','写入飞书'],source:'文档',hint:'支持 PDF、Word、PowerPoint、TXT、Markdown；最多 10 个，累计不超过 200 MB',action:'开始生成学习笔记 →'}
    };
    let current='video';
    const btn=(label,cls='')=>`<button type="button" class="${cls}">${label}</button>`;
    function intro(s){return `<p class="eyebrow"><i></i>${s.tab}工作台</p><h1>${s.title}</h1><p class="intro-copy">${s.copy}</p><div class="steps steps-${s.steps.length}">${s.steps.map((x,i)=>`<div class="step ${i===0?'active':''}"><b>${i+1}</b><span>${x}</span></div>`).join('')}</div><div class="trust"><span><b>✓</b>原始文件保留</span><span><b>✓</b>处理状态可追溯</span><span><b>✓</b>可回到原文核对</span></div>`}
    function drop(label,desc,mark='↥'){const copy=label?`<div class="upload-label"><strong>${label}</strong></div><p class="upload-hint">${desc}</p>`:'';const prompt=!label&&mark==='◉'?'拖入录音文件，或点击选择':'拖入文件，或点击选择';return `<div>${copy}<button type="button" class="dropzone ${label?'':'single'} demo-select"><span class="drop-icon">${mark}</span><strong>${prompt}</strong><small>文件仅用于生成当前笔记</small></button><div class="meta"><span>尚未选择文件</span><span>0 B</span></div></div>`}
    function styles(){return `<p class="section-label">笔记风格</p><div class="style-grid"><button type="button" class="style active"><strong>学习笔记</strong><small>重点、结构与行动清单</small></button><button type="button" class="style"><strong>会议纪要</strong><small>议题、决策、待办与责任人</small></button></div>`}
    function panel(s){const paired=s.key==='paired';const content=paired?`<p class="section-label">上传两份素材</p><div class="drop-grid">${drop('主视频','提供屏幕、PPT 和视频音轨','▣')}${drop('辅助录音','提供更清晰的讲话内容','◉')}</div><div class="control" style="margin-top:10px"><span>时间对齐</span><div class="segmented">${btn('自动对齐','active')}${btn('手动偏移')}</div></div>`:`<p class="section-label">上传${s.source}</p>${drop('',s.hint,s.key==='recording'?'◉':'↥')}`;const panelTitle=s.key==='recording'?'选择录音文件':`选择${s.source}文件`;return `<div class="panel-head"><div><h2>${panelTitle}</h2><p>${s.hint}</p></div><span class="panel-mark">${s.mark}</span></div>${content}${styles()}${s.key!=='document'?`<div class="toggle-row"><span><strong>关键画面（可选）</strong><small>先保留原始截图，再按需补充视觉证据</small></span><button type="button" class="toggle"><i></i></button></div>`:''}<div class="footer"><small>处理完成后可回到转化记录，核对原始文件与生成结果。</small>${btn(s.action,'primary demo-action')}</div>`}
    function render(){const s=pages[current];document.documentElement.style.setProperty('--accent',s.accent);document.documentElement.style.setProperty('--accent-soft',s.soft);document.getElementById('brandMark').textContent=s.mark;document.querySelector('.brand-title').textContent=s.tab+'工作台';document.getElementById('tabs').innerHTML=Object.values(pages).map(x=>`<button type="button" class="tab ${x.key===current?'active':''}" data-page="${x.key}"><span class="tab-mark">${x.mark}</span>${x.tab}</button>`).join('');document.getElementById('intro').innerHTML=intro(s);document.getElementById('panel').innerHTML=panel(s);bind()}
    function toast(msg){const n=document.getElementById('toast');n.textContent=msg;n.classList.add('show');clearTimeout(window.__t);window.__t=setTimeout(()=>n.classList.remove('show'),1600)}
    function bind(){document.querySelectorAll('[data-page]').forEach(x=>x.addEventListener('click',()=>{current=x.dataset.page;render()}));document.getElementById('backBtn').onclick=()=>toast('原型演示：返回工作台入口');document.querySelectorAll('.demo-select').forEach(x=>x.addEventListener('click',()=>toast('原型演示：打开本地文件选择器')));document.querySelectorAll('.demo-action').forEach(x=>x.addEventListener('click',()=>toast('原型演示：已保留当前页面功能语义')));document.querySelectorAll('.style').forEach(x=>x.addEventListener('click',()=>{x.parentElement.querySelectorAll('.style').forEach(y=>y.classList.remove('active'));x.classList.add('active')}));document.querySelectorAll('.segmented button').forEach(x=>x.addEventListener('click',()=>{x.parentElement.querySelectorAll('button').forEach(y=>y.classList.remove('active'));x.classList.add('active')}));document.querySelectorAll('.toggle').forEach(x=>x.addEventListener('click',()=>x.classList.toggle('on')))}
    render();
  </script>
</body>
</html>
