    .media-layout{display:grid;grid-template-columns:minmax(0,1.18fr) minmax(330px,.82fr);gap:16px}.stat-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;padding:16px 20px}.stat{border:1px solid var(--line);border-radius:10px;padding:12px;background:#fbfcfd}.stat-label{font-size:10px;color:#8a929c}.stat-value{font-size:20px;font-weight:760;margin-top:7px;letter-spacing:-.03em}.stat-note{font-size:10px;color:#9ba3ad;margin-top:4px}.config-body{padding:18px 20px}.field-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.field{display:grid;gap:7px}.field label{font-size:11px;color:#616b77;font-weight:650}.field input,.field select{width:100%;height:38px;border:1px solid #dfe4ea;border-radius:8px;padding:0 11px;color:var(--ink);background:white;font-size:12px;outline:none}.field input:focus,.field select:focus{border-color:#8fb0f2;box-shadow:0 0 0 3px rgba(37,99,235,.09)}.toggle-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px;border:1px solid var(--line);border-radius:9px;background:#fbfcfd}.toggle-copy strong{display:block;font-size:12px}.toggle-copy span{display:block;color:var(--muted);font-size:10px;margin-top:4px}.switch{width:38px;height:22px;border-radius:999px;background:#cbd2dc;padding:3px;transition:.18s}.switch i{display:block;width:16px;height:16px;background:white;border-radius:50%;box-shadow:0 1px 3px rgba(0,0,0,.18);transition:.18s}.switch.on{background:var(--green)}.switch.on i{transform:translateX(16px)}.config-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}.preview-list{display:grid;gap:10px;padding:16px 20px}.file-row{display:flex;align-items:center;justify-content:space-between;gap:14px;border:1px solid var(--line);border-radius:10px;padding:12px}.file-main{min-width:0}.file-name{font-size:12px;font-weight:680;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.file-meta{font-size:10px;c <body>
  <div class="app">
    <aside class="rail">
      <div class="brand"><div class="brand-mark"><i data-lucide="sliders-horizontal"></i></div><div><div class="brand-title">参数配置</div><div class="brand-sub">媒体笔记工作台</div></div></div>
      <div class="rail-label">配置模块</div>
      <nav class="nav" id="nav">
        <button class="active" data-view="setup"><i class="nav-icon" data-lucide="list-checks"></i><span><span class="nav-title">开始使用</span><span class="nav-desc">检查环境并完成下一步</span></span></button>
        <button data-view="connectors"><i class="nav-icon" data-lucide="cable"></i><span><span class="nav-title">连接器</span><span class="nav-desc">飞书、钉钉协作通知</span></span></button>
        <button data-view="prompts"><i class="nav-icon" data-lucide="file-pen-line"></i><span><span class="nav-title">提示词模板</span><span class="nav-desc">编辑、发布与版本管理</span></span></button>
        <button data-view="models"><i class="nav-icon" data-lucide="layers-3"></i><span><span class="nav-title">模型服务与转录</span><span class="nav-desc">能力模型与转录方式</span></span></button>
        <button data-view="media"><i class="nav-icon" data-lucide="hard-drive"></i><span><span class="nav-title">媒体清理</span><span class="nav-desc">清理策略与执行记录</span></span></button>
      </nav>
      <div class="rail-foot">密钥仅以脱敏状态显示<br/>保存后不会回传页面或写入日志</div>
    </aside>
    <main class="main">
      <header class="topbar"><div class="crumb">配置中心&nbsp; / &nbsp;<strong id="crumb">开始使用</strong></div><div class="top-actions"><button class="icon-btn" title="帮助"><i data-lucide="circle-help"></i></button><button class="ghost-btn" id="backBtn"><i data-lucide="arrow-left"></i>返回入口</button></div></header>
      <div id="content"></div>
    </main>
  </div>
  <div class="drawer-backdrop" id="drawerBackdrop"><aside class="drawer"><div class="drawer-head"><div><h2 id="drawerTitle">执行详情</h2><p id="drawerCopy"></p></div><button class="icon-btn" id="drawerClose" title="关闭"><i data-lucide="x"></i></button></div><div class="drawer-body" id="drawerBody"></div><div class="drawer-foot"><button class="ghost-btn" id="drawerClose2">关闭</button></div></aside></div>
  <div class="toast" id="toast" role="status"></div>
  <script>
    window.lucide=window.lucide||{createIcons(){}};const $=s=>document.querySelector(s);const content=$('#content');
    const state={view:'setup',capFilter:'all',schedule:true,history:[
      {id:'r-240831-0310',source:'定时任务',time:'2026-08-31 03:10',result:'success',label:'已完成',deleted:18,bytes:'2.84 GB',files:['meeting-2026-07-11.mp4','course-demo-0712.mov','voice-memo-0714.m4a']},
      {id:'r-240829-1618',source:'手工执行',time:'2026-08-29 16:18',result:'partial',label:'部分完成',deleted:7,bytes:'816 MB',files:['research-sync-0628.mp4','screen-record-0629.webm','archive-old-0627.mp4'],failed:'archive-old-0627.mp4'},
      {id:'r-240824-0300',source:'定时任务',time:'2026-08-24 03:00',result:'success',label:'已完成',deleted:23,bytes:'4.12 GB',files:['weekly-review-0621.mp4','interview-0622.m4a','demo-0623.mov']}
    ]};
    const caps=[
      {icon:'message-circle',name:'钉钉适配器',desc:'发送笔记、任务结果与异常提醒到钉钉群或个人会话。',status:'ready',statusText:'已连接',meta:'机器人 · 2 个通知场景'},
      {icon:'send',name:'飞书适配器',desc:'同步文档、通知与任务状态，支持多维表格写入。',status:'ready',statusText:'已连接',meta:'文档 · 消息 · 多维表格'},
      {icon:'brain-circuit',name:'AI 笔记生成',desc:'学习笔记、会议纪要和媒体转录统一使用当前模型路由。',status:'ready',statusText:'可使用',meta:'默认模型：DeepSeek V3'},
      {icon:'mic-2',name:'音视频转录',desc:'本地音视频转写，支持长任务进度和失败重试。',status:'warn',statusText:'需配置',meta:'待配置：转录服务'},
      {icon:'hard-drive',name:'媒体生命周期',desc:'识别孤儿文件与失败任务媒体，按保留期安全清理。',status:'ready',statusText:'已启用',meta:'下次执行：周日 03:00'},
      {icon:'shield-check',name:'安全与隐私',desc:'密钥脱敏显示，任务日志不记录原始密钥内容。',status:'ready',statusText:'已就绪',meta:'本地运行时 · 已开启'}
    ];
    function pageHead(eyebrow,title,copy,status){return `<div class="page"><div class="page-head"><div><div class="eyebrow">${eyebrow}</div><h1>${title}</h1><div class="page-lede">${copy}</div></div>${status?`<div class="head-status"><span class="dot"></span>${status}</div>`:''}</div>${''}`}
    function setup(){const list=caps.filter(c=>state.capFilter==='all'||(state.capFilter==='ready'?c.status==='ready':c.status==='warn'));return pageHead('Setup overview','开始使用','先确认运行环境与连接能力，再进入具体配置。每张能力卡都提供当前状态与下一步动作，避免在空白区域里寻找入口。','4 / 6 项能力已就绪')+`<div class="setup-hero"><section class="hero-card"><div class="section-kicker" style="color:#8fb4ff">WORKBENCH READY</div><h2>你的工作台已经可以开始运行</h2><p>系统检测到本地运行时、媒体目录与默认模型。只需补齐转录服务，即可完成完整的“媒体 → 笔记 → 协作”链路。</p><div class="hero-meta"><div class="hero-metric"><strong>4</strong><span>已就绪</span></div><div class="hero-metric"><strong>1</strong><span>需配置</span></div><div class="hero-metric"><strong>1</strong><span>可选增强</span></div></div></section><section class="panel readiness"><div class="panel-title">系统检查</div><div class="panel-copy">最近检查：今天 09:42 · 本地运行时</div><div class="readiness-row"><span>本地运行时</span><span class="status ready">正常</span></div><div class="readiness-row"><span>媒体目录读写</span><span class="status ready">正常</span></div><div class="readiness-row"><span>钉钉适配器</span><span class="status ready">已连接</span></div><div class="readiness-row"><span>转录服务</span><span class="status warn">待配置</span></div></section></div><div class="cap-toolbar"><div><div class="panel-title">能力清单</div><div class="panel-copy">能力项随当前系统状态更新，点击“去配置”进入对应模块。</div></div><div class="segmented"><button class="${state.capFilter==='all'?'active':''}" data-cap="all">全部</button><button class="${state.capFilter==='ready'?'active':''}" data-cap="ready">已就绪</button><button class="${state.capFilter==='warn'?'active':''}" data-cap="warn">需配置</button></div></div><div class="cap-grid">${list.map(c=>`<article class="cap-card"><div class="cap-top"><div class="cap-icon"><i data-lucide="${c.icon}"></i></div><span class="status ${c.status}">${c.statusText}</span></div><h3>${c.name}</h3><p>${c.desc}</p><div class="cap-foot"><span>${c.meta}</span><button class="link-btn" data-jump="${c.name==='钉钉适配器'?'connectors':c.name==='媒体生命周期'?'media':c.name==='AI 笔记生成'?'prompts':'models'}">${c.status==='warn'?'去配置':'查看设置'} <i data-lucide="arrow-up-right" style="width:12px;height:12px;vertical-align:-3px"></i></button></div></article>`).join('')}</div></div>`}
    function media(){return pageHead('Storage / Cleanup','媒体清理','把清理策略、待处理文件和任务执行历史放在同一个工作区。每次定时或手工执行都会留下可追溯记录。',state.schedule?'定时清理已启用 · 下次：周日 03:00':'定时清理已关闭 · 可手工执行')+`<div class="media-layout"><div class="grid"><section class="panel"><div class="panel-head"><div><div class="panel-title">清理概览</div><div class="panel-copy">按当前保留策略盘点本地媒体，不会删除运行中的文件。</div></div><button class="ghost-btn" id="refreshBtn"><i data-lucide="refresh-cw"></i>刷新盘点</button></div><div class="stat-grid"><div class="stat"><div class="stat-label">媒体文件</div><div class="stat-value">126</div><div class="stat-note">全部目录</div></div><div class="stat"><div class="stat-label">占用空间</div><div class="stat-value">38.6 GB</div><div class="stat-note">+1.8 GB 本周</div></div><div class="stat"><div class="stat-label">本次可清理</div><div class="stat-value" style="color:var(--red)">48</div><div class="stat-note">超过 30 天</div></div><div class="stat"><div class="stat-label">预计释放</div><div class="stat-value" style="color:var(--green)">7.8 GB</div><div class="stat-note">按最新盘点</div></div></div><div class="panel-head" style="border-top:1px solid var(--line)"><div><div class="panel-title">可清理文件预览</div><div class="panel-copy">执行前会再次复核文件状态，展示本次将删除的具体文件。</div></div><button class="danger-btn" id="runBtn"><i data-lucide="trash-2"></i>手工执行清理</button></div><div class="preview-list"><div class="file-row"><div class="file-main"><div class="file-name">meeting-2026-07-11.mp4</div><div class="file-meta">孤儿文件 · 修改于 2026-07-11 · 未被任务引用</div></div><div class="file-size">1.24 GB</div></div><div class="file-row"><div class="file-main"><div class="file-name">course-demo-0712.mov</div><div class="file-meta">关联任务均失败 · 保留期已满</div></div><div class="file-size">894 MB</div></div><div class="file-row"><div class="file-main"><div class="file-name">voice-memo-0714.m4a</div><div class="file-meta">孤儿文件 · 修改于 2026-07-14</div></div><div class="file-size">86 MB</div></div></div><div class="history-foot"><span>展示 3 / 48 个可清理文件</span><button class="link-btn">查看全部文件 <i data-lucide="arrow-right" style="width:12px;height:12px;vertical-align:-3px"></i></button></div></section><section class="panel history"><div class="panel-head"><div><div class="panel-title">执行历史</div><div class="panel-copy">定时任务与手工执行统一记录结果、时间、释放空间和文件明细。</div></div><span class="status ready">保留最近 30 次</span></div><table class="history-table"><thead><tr><th>执行时间</th><th>来源</th><th>结果</th><th>删除文件</th><th>释放空间</th><th></th></tr></thead><tbody>${state.history.map(h=>`<tr><td><strong>${h.time.slice(0,10)}</strong><br><span class="table-muted">${h.time.slice(11)}</span></td><td class="table-muted">${h.source}</td><td><span class="result ${h.result}"><i class="result-dot"></i>${h.label}</span></td><td>${h.deleted} 个</td><td>${h.bytes}</td><td><button class="table-link" data-history="${h.id}">查看详情</button></td></tr>`).join('')}</tbody></table><div class="history-foot"><span>共 ${state.history.length} 次执行 · 最近一次：${state.history[0].time}</span><button class="link-btn" id="exportBtn"><i data-lucide="download" style="width:12px;height:12px;vertical-align:-3px"></i>导出记录</button></div></section></div><section class="panel"><div class="panel-head"><div><div class="panel-title">清理策略</div><div class="panel-copy">策略保存后对定时和手工执行同时生效。</div></div><span class="status ${state.schedule?'ready':'off'}">${state.schedule?'定时已启用':'定时已关闭'}</span></div><div class="config-body"><div class="toggle-row"><div class="toggle-copy"><strong>启用定时清理</strong><span>关闭时仍可预览并手工执行清理</span></div><button class="switch ${state.schedule?'on':''}" id="scheduleToggle" aria-label="启用定时清理"><i></i></button></div><div class="field-grid" style="margin-top:14px"><div class="field"><label>执行周期</label><select><option>每周</option><option>每天</option><option>每月</option></select></div><div class="field"><label>执行时间</label><input type="time" value="03:00" /></div><div class="field"><label>媒体保留天数</label><input type="number" value="30" /></div><div class="field"><label>每周执行日</label><select><option>星期日</option><option>星期一</option><option>星期五</option></select></div></div><div class="toggle-row" style="margin-top:14px"><div class="toggle-copy"><strong>清理孤儿文件</strong><span>没有任何笔记记录引用的媒体</span></div><button class="switch on" aria-label="清理孤儿文件"><i></i></button></div><div class="toggle-row" style="margin-top:9px;background:var(--amber-soft);border-color:#f5dfae"><div class="toggle-copy"><strong>清理失败任务媒体</strong><span>仅删除超过保留期且关联任务全部失败的媒体</span></div><button class="switch" aria-label="清理失败任务媒体"><i></i></button></div><div class="config-actions"><button class="ghost-btn" id="resetBtn">恢复默认</button><button class="primary-btn" id="saveBtn"><i data-lucide="save"></i>保存配置</button></div><div class="page-note" style="margin-top:13px"><i data-lucide="info" style="width:13px;height:13px;vertical-align:-3px"></i> 任务记录会保留执行来源、开始时间、结果、删除文件列表和失败原因，便于审计与复盘。</div></div></section></div>`}
    function prompts(){return pageHead('Prompt center','提示词模板','把常用的生成策略收拢到独立的编辑区，发布与版本管理的结果在这里清晰可见。','当前发布：学习笔记 V3')+`<div class="prompt-layout"><section class="panel template-list"><div class="section-kicker" style="padding:8px 9px 10px">模板类型</div><button class="template-item active"><strong>学习笔记</strong><span>课程、书籍、报告与技术资料</span></button><button class="template-item"><strong>会议纪要</strong><span>录音、访谈与项目同步</span></button><button class="template-item"><strong>研究简报</strong><span>资料汇总与结论提炼</span></button></section><section class="panel"><div class="panel-head"><div><div class="panel-title">学习笔记 <span class="status ready" style="margin-left:6px">系统默认</span></div><div class="panel-copy">发布后才会传给 AI，草稿可以继续修改。</div></div><div class="top-actions"><button class="ghost-btn"><i data-lucide="history"></i>版本管理</button><button class="primary-btn"><i data-lucide="send"></i>发布生效</button></div></div><div class="prompt-editor">目标：把原始材料整理成尽可能详细、准确、可复习、可检索、可复用的学习或培训笔记。先完成覆盖全部证据的详细主笔记，再生成一页复习；不要把主笔记写成短摘要，也不要为了篇幅扩写。\n\n一、真实性与完整性\n1. 只能使用原文和系统提供的证据账本，不得补充原文没有的事实、数字、案例、因果关系或方法。\n2. 完整保留具体数字、版本、价格、时间、参数、人名、产品名、步骤、条件、例外与限制。\n3. 不确定内容标记【待人工确认】。</div><div class="editor-actions"><span>1,420 / 60,000 字符</span><span>V3 · 2026-08-28 发布</span></div></section></div></div>`}
    function connectors(){return pageHead('Connectors','连接器','连接协作平台后，笔记与任务结果可以按场景推送到团队工作空间。','钉钉已连接 · 飞书已连接')+`<div class="model-grid"><section class="panel model-card"><div class="cap-icon"><i data-lucide="message-circle"></i></div><strong>钉钉适配器</strong><p>群机器人通知、个人会话提醒与任务结果卡片。</p><span class="status ready">已连接</span><div class="config-actions"><button class="ghost-btn">测试通知</button><button class="primary-btn">编辑配置</button></div></section><section class="panel model-card"><div class="cap-icon"><i data-lucide="send"></i></div><strong>飞书适配器</strong><p>文档同步、消息通知与多维表格记录。</p><span class="status ready">已连接</span><div class="config-actions"><button class="ghost-btn">测试通知</button><button class="primary-btn">编辑配置</button></div></section><section class="panel model-card"><div class="cap-icon" style="background:#f0f2f5;color:#6d7681"><i data-lucide="plus"></i></div><strong>添加连接器</strong><p>后续可以继续接入新的协作平台。</p><span class="status off">可选</span><div class="config-actions"><button class="ghost-btn">查看支持列表</button></div></section></div></div>`}
    function models(){return pageHead('Models & transcription','模型服务与转录','统一查看能力模型、API 提供者和转录方式，减少跨页面来回切换。','默认路由正常')+`<div class="grid"><section class="panel"><div class="panel-head"><div><div class="panel-title">能力路由</div><div class="panel-copy">当前能力会按优先级选择可用模型，失败时自动切换备用提供者。</div></div><button class="primary-btn">编辑路由</button></div><div class="stat-grid"><div class="stat"><div class="stat-label">默认模型</div><div class="stat-value" style="font-size:16px">DeepSeek V3</div><div class="stat-note">学习笔记 · 会议纪要</div></div><div class="stat"><div class="stat-label">备用模型</div><div class="stat-value" style="font-size:16px">GPT-4.1 mini</div><div class="stat-note">故障自动切换</div></div><div class="stat"><div class="stat-label">转录方式</div><div class="stat-value" style="font-size:16px">本地服务</div><div class="stat-note">长任务可重试</div></div><div class="stat"><div class="stat-label">API 提供者</div><div class="stat-value">3</div><div class="stat-note">2 个已验证</div></div></div></section><section class="panel"><div class="panel-head"><div><div class="panel-title">服务健康</div><div class="panel-copy">最近一次连通性检查：今天 09:41</div></div><span class="status ready">全部正常</span></div><div class="config-body"><div class="readiness-row"><span>DeepSeek API</span><span class="status ready">已验证 · 420 ms</span></div><div class="readiness-row"><span>OpenAI 兼容 API</span><span class="status ready">已验证 · 610 ms</span></div><div class="readiness-row"><span>本地转录服务</span><span class="status warn">待配置</span></div></div></section></div></div>`}
    function render(){const names={setup:'开始使用',media:'媒体清理',prompts:'提示词模板',connectors:'连接器',models:'模型服务与转录'};$('#crumb').textContent=names[state.view];content.innerHTML=state.view==='setup'?setup():state.view==='media'?media():state.view==='prompts'?prompts():state.view==='connectors'?connectors():models();document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===state.view));document.querySelectorAll('[data-cap]').forEach(b=>b.onclick=()=>{state.capFilter=b.dataset.cap;render()});document.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>{state.view=b.dataset.jump;render()});$('#scheduleToggle')?.addEventListener('click',()=>{state.schedule=!state.schedule;render()});$('#saveBtn')?.addEventListener('click',()=>toast('清理配置已保存，执行历史将继续保留。'));$('#resetBtn')?.addEventListener('click',()=>toast('已恢复默认策略，请点击保存配置。'));$('#runBtn')?.addEventListener('click',runCleanup);$('#refreshBtn')?.addEventListener('click',()=>toast('已完成最新文件盘点。'));$('#exportBtn')?.addEventListener('click',()=>toast('原型演示：执行记录已准备导出。'));document.querySelectorAll('[data-history]').forEach(b=>b.onclick=()=>openDetail(state.history.find(h=>h.id===b.dataset.history)));lucide.createIcons()}
    function toast(msg){const el=$('#toast');el.textContent=msg;el.classList.add('show');clearTimeout(window.__toast);window.__toast=setTimeout(()=>el.classList.remove('show'),2300)}
    function runCleanup(){const now=new Date();const pad=n=>String(n).padStart(2,'0');const time=`${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}`;state.history.unshift({id:'r-'+Date.now(),source:'手工执行',time,result:'success',label:'已完成',deleted:48,bytes:'7.8 GB',files:['meeting-2026-07-11.mp4','course-demo-0712.mov','voice-memo-0714.m4a','+ 45 个文件']});render();toast('清理完成：已删除 48 个文件，释放 7.8 GB。')}
    function openDetail(h){if(!h)return;$('#drawerTitle').textContent='执行详情';$('#drawerCopy').textContent=`${h.source} · ${h.time} · 执行编号 ${h.id}`;$('#drawerBody').innerHTML=`<div class="detail-summary"><div class="detail-stat"><b>${h.deleted}</b><span>删除文件</span></div><div class="detail-stat"><b>${h.bytes}</b><span>释放空间</span></div><div class="detail-stat"><b class="result ${h.result}" style="font-size:13px">${h.label}</b><span>执行结果</span></div></div><div class="section-kicker" style="margin-bottom:10px">文件明细</div><div class="detail-list">${h.files.map(f=>`<div class="detail-file"><strong>${f}</strong><span>${h.result==='partial'&&f===h.failed?'删除失败：文件正在使用':'已删除 · 按保留期策略匹配'}</span></div>`).join('')}</div>${h.failed?`<div class="page-note" style="margin-top:14px;color:#9a6d1a;background:var(--amber-soft)"><i data-lucide="triangle-alert" style="width:13px;height:13px;vertical-align:-3px"></i> 失败文件：${h.failed}。下次任务会重新检查。</div>`:''}`;$('#drawerBackdrop').classList.add('show');lucide.createIcons()}
    function closeDrawer(){$('#drawerBackdrop').classList.remove('show')}
    document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{state.view=b.dataset.view;render()});$('#backBtn').onclick=()=>toast('原型演示：这里会返回应用入口。');$('#drawerClose').onclick=closeDrawer;$('#drawerClose2').onclick=closeDrawer;$('#drawerBackdrop').onclick=e=>{if(e.target.id==='drawerBackdrop')closeDrawer()};render();
  </script>
