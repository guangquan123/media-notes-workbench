    function setup(){const list=caps.filter(c=>state.capFilter==='all'||(state.capFilter==='ready'?c.status==='ready':c.status==='warn'));return head('Setup overview','开始使用','先完成自动检测，再按需调整连接器、转录与模型。每项能力只展示当前状态与对应入口，不改变原有功能。','<span class="status-pill"><span class="status-dot"></span>4 / 6 项能力已就绪</span>')+`<div class="setup-summary"><section class="summary-card"><div class="eyebrow" style="color:#8fb4ff">SYSTEM CHECK</div><h2>环境检查已完成</h2><p>本地运行时和媒体目录正常，连接器保持当前配置。转录服务还需要补充配置。</p><div class="summary-stats"><div><strong>4</strong><span>已就绪</span></div><div><strong>1</strong><span>需配置</span></div><div><strong>1</strong><span>可选增强</span></div></div></section><section class="panel check-list"><div class="panel-title">最近一次检查</div><div class="panel-copy">今天 09:42 · 本地运行时</div><div class="check-row"><span>本地运行时</span><span class="state ready">正常</span></div><div class="check-row"><span>媒体目录读写</span><span class="state ready">正常</span></div><div class="check-row"><span>钉钉适配器</span><span class="state ready">已连接</span></div><div class="check-row"><span>转录服务</span><span class="state warn">待配置</span></div></section></div><div class="cap-toolbar"><div><div class="panel-title">能力项</div><div class="panel-copy">能力项随当前系统状态更新，入口保持原有模块路径。</div></div><div class="segmented"><button class="${state.capFilter==='all'?'active':''}" data-cap="all">全部</button><button class="${state.capFilter==='ready'?'active':''}" data-cap="ready">已就绪</button><button class="${state.capFilter==='warn'?'active':''}" data-cap="warn">需配置</button></div></div><div class="cap-grid">${list.map(c=>`<article class="cap-card"><div class="cap-top"><div class="cap-icon"><i data-lucide="${c.icon}"></i></div><span class="state ${c.status}">${c.label}</span></div><h3>${c.name}</h3><p>${c.desc}</p><div class="cap-foot"><span>${c.meta}</span><button class="text-link" data-jump="${c.jump}">${c.status==='warn'?'去配置':'查看设置'} <i data-lucide="arrow-up-right" style="width:11px;height:11px;vertical-align:-2px"></i></button></div></article>`).join('')}</div></div>`}
    function connectors(){return head('Connectors','连接器','选择飞书或钉钉协作能力，并配置该连接器的授权、连接测试和通知。这里只重排原有字段与操作。','<span class="status-pill"><span class="status-dot"></span>当前使用：钉钉</span>')+`<div class="connector-layout"><section class="panel switch-list"><div class="section-label" style="padding:7px 8px 9px">连接器</div><button class="switch-item active"><strong>钉钉</strong><span>笔记和待办同步到钉钉</span></button><button class="switch-item"><strong>飞书</strong><span>笔记和待办同步到飞书</span></button></section><div class="connector-stack"><section class="panel"><div class="panel-head"><div><div class="panel-title">钉钉连接器</div><div class="panel-copy">使用钉钉手机端确认授权，无需填写 App ID 或 App Secret。</div></div><span class="state ready">已连接</span></div><div class="panel-body"><div class="connector-status"><div class="status-box"><strong>授权状态</strong><p>当前授权人：张敏 · 最近验证：今天 09:38</p><button class="btn"><i data-lucide="qr-code"></i>重新授权</button></div><div class="status-box"><strong>连接测试</strong><p>最近一次测试成功 · 延迟 428 ms</p><button class="btn"><i data-lucide="plug-zap"></i>测试连接</button></div></div></div></section><section class="panel"><div class="panel-head"><div><div class="panel-title">通知设置</div><div class="panel-copy">连接器保持单一输出位置，按原有场景配置通知。</div></div></div><div class="panel-body"><div class="field-grid"><div class="field"><label>通知方式</label><select><option>钉钉群机器人</option><option>个人会话</option></select></div><div class="field"><label>Webhook 地址</label><input value="https://oapi.dingtalk.com/robot/send" /></div><div class="field full"><label>Webhook Secret（可选）</label><input type="password" value="dingtalk-secret" /></div></div><div class="notice" style="margin-top:13px">钉钉模式会只向钉钉创建文档。需要同步钉钉待办时，请在高级设置中填写待办执行人。</div><div class="inline-actions"><button class="btn">取消</button><button class="btn primary" id="connectorSave"><i data-lucide="save"></i>保存连接器</button></div></div></section></div></div></div>`}
    function models(){return head('Models & transcription','模型服务与转录','配置多个 API 提供者、能力模型和转录方式。仅调整信息分组与留白，不新增配置能力。','<span class="status-pill"><span class="status-dot"></span>当前路由正常</span>')+`<div class="model-layout"><section class="panel"><div class="panel-head"><div><div class="panel-title">模型服务提供者</div><div class="panel-copy">API 地址和密钥只维护一次，供转录与总结模型复用。</div></div><button class="btn primary"><i data-lucide="plus"></i>新增提供者</button></div><div class="panel-body grid"><div class="provider-row"><div><div class="provider-name">公司内部模型 API</div><div class="provider-meta">https://api.example.com/v1 · API Key 已保存 · 已启用</div></div><span class="state ready">已启用</span><button class="btn">编辑</button></div><div class="provider-row"><div><div class="provider-name">腾讯云 ASR</div><div class="provider-meta">腾讯云转录资源包 · API Key 已保存</div></div><span class="state ready">已启用</span><button class="btn">编辑</button></div></div></section><section class="panel"><div class="panel-head"><div><div class="panel-title">模型配置</div><div class="panel-copy">一次性选择转录方式、转录模型和总结模型。</div></div></div><div class="panel-body"><div class="section-label">转录方式</div><div class="model-modes" style="margin-top:9px"><button class="mode active"><strong>我的 API 模型</strong><span>使用下方提供者和转录模型。</span></button><button class="mode"><strong>腾讯 ASR</strong><span>使用已配置的腾讯云 ASR 资源包。</span></button></div><div class="field-grid" style="margin-top:15px"><div class="field"><label>模型服务提供者</label><select><option>公司内部模型 API</option><option>腾讯云 ASR</option></select></div><div class="field"><label>转录模型</label><select><option>whisper-large-v3</option><option>paraformer-v2</option></select></div><div class="field"><label>总结模型提供者</label><select><option>公司内部模型 API</option><option>OpenAI 兼容 API</option></select></div><div class="field"><label>总结模型</label><select><option>deepseek-chat</option><option>gpt-4.1-mini</option></select></div></div><div class="notice" style="margin-top:14px"><i data-lucide="check-circle-2" style="width:13px;height:13px;vertical-align:-3px;color:var(--green)"></i> 当前组合：转录 whisper-large-v3；总结 deepseek-chat</div><div class="inline-actions"><button class="btn primary" id="modelSave"><i data-lucide="save"></i>保存模型配置</button></div></div></section></div></div>`}
    function prompts(){return head('Prompt center','提示词模板','编辑、发布并管理提示词版本。页面只调整编辑器与操作区的布局。','<span class="status-pill"><span class="status-dot"></span>当前发布：学习笔记 V3</span>')+`<div class="connector-layout"><section class="panel switch-list"><div class="section-label" style="padding:7px 8px 9px">提示词类型</div><button class="switch-item active"><strong>学习笔记</strong><span>课程、书籍、报告、技术资料</span></button><button class="switch-item"><strong>会议纪要</strong><span>录音、访谈、项目同步</span></button></section><section class="panel"><div class="panel-head"><div><div class="panel-title">学习笔记 <span class="state ready" style="margin-left:5px">系统默认</span></div><div class="panel-copy">发布后才会传给 AI；草稿可以继续修改。</div></div><div class="top-actions"><button class="btn">版本管理</button><button class="btn primary">发布生效</button></div></div><div class="panel-body"><div class="notice" style="min-height:340px;white-space:pre-wrap;font-size:12px;line-height:1.9;color:#2d353f">目标：把原始材料整理成尽可能详细、准确、可复习、可检索、可复用的学习或培训笔记。\n\n一、真实性与完整性\n1. 只能使用原文和系统提供的证据账本。\n2. 完整保留具体数字、版本、价格、时间、参数、人名、步骤和限制。\n3. 不确定内容标记【待人工确认】。</div><div class="inline-actions"><span class="hint">1,420 / 60,000 字符</span><span class="hint">V3 · 2026-08-28 发布</span></div></div></section></div></div>`}
    function media(){return head('Storage / Cleanup','媒体清理','配置定时或手工清理策略，查看本次待清理文件。执行历史单独展示，避免一个页面堆叠所有信息。',`<button class="btn" id="historyBtn"><i data-lucide="history"></i>查看执行历史</button><span class="status-pill"><span class="status-dot"></span>${state.schedule?'定时清理已启用 · 周日 03:00':'定时清理已关闭'}</span>`)+`<div class="media-layout"><div class="grid"><section class="panel"><div class="panel-head"><div><div class="panel-title">清理概览</div><div class="panel-copy">只清理达到保留期且未被运行中任务使用的本地媒体。</div></div><button class="btn" id="refreshBtn"><i data-lucide="refresh-cw"></i>刷新盘点</button></div><div class="stat-grid"><div class="stat"><div class="stat-label">媒体文件</div><div class="stat-value">126</div><div class="stat-note">全部目录</div></div><div class="stat"><div class="stat-label">占用空间</div><div class="stat-value">38.6 GB</div><div class="stat-note">+1.8 GB 本周</div></div><div class="stat"><div class="stat-label">本次可清理</div><div class="stat-value" style="color:var(--red)">48</div><div class="stat-note">超过 30 天</div></div><div class="stat"><div class="stat-label">预计释放</div><div class="stat-value" style="color:var(--green)">7.8 GB</div><div class="stat-note">按最新盘点</div></div></div><div class="panel-head" style="border-top:1px solid var(--line)"><div><div class="panel-title">本次清理预览</div><div class="panel-copy">执行前按最新文件状态再次复核。</div></div><button class="btn danger" id="runBtn"><i data-lucide="trash-2"></i>手工执行清理</button></div><div class="file-list"><div class="file-row"><div style="min-width:0"><div class="file-name">meeting-2026-07-11.mp4</div><div class="file-meta">孤儿文件 · 未被任务引用</div></div><div class="file-size">1.24 GB</div></div><div class="file-row"><div style="min-width:0"><div class="file-name">course-demo-0712.mov</div><div class="file-meta">关联任务均失败 · 保留期已满</div></div><div class="file-size">894 MB</div></div><div class="file-row"><div style="min-width:0"><div class="file-name">voice-memo-0714.m4a</div><div class="file-meta">孤儿文件 · 修改于 2026-07-14</div></div><div class="file-size">86 MB</div></div></div><div class="history-cta"><span><strong>48</strong> 个文件符合清理条件</span><button class="text-link" id="historyBtn2">查看全部执行记录 <i data-lucide="arrow-right" style="width:11px;height:11px;vertical-align:-2px"></i></button></div></section></div><section class="panel"><div class="panel-head"><div><div class="panel-title">清理策略</div><div class="panel-copy">保存后对定时和手工执行同时生效。</div></div><span class="state ${state.schedule?'ready':'off'}">${state.schedule?'定时已启用':'定时已关闭'}</span></div><div class="panel-body"><div class="toggle-row"><div class="toggle-copy"><strong>启用定时清理</strong><span>关闭时仍可预览并手工执行清理</span></div><button class="switch ${state.schedule?'on':''}" id="scheduleToggle" aria-label="启用定时清理"><i></i></button></div><div class="field-grid" style="margin-top:13px"><div class="field"><label>执行周期</label><select><option>每周</option><option>每天</option><option>每月</option></select></div><div class="field"><label>执行时间</label><input type="time" value="03:00" /></div><div class="field"><label>媒体保留天数</label><input type="number" value="30" /></div><div class="field"><label>每周执行日</label><select><option>星期日</option><option>星期一</option></select></div></div><div class="toggle-row" style="margin-top:13px"><div class="toggle-copy"><strong>清理孤儿文件</strong><span>没有任何笔记记录引用的文件</span></div><button class="switch on" aria-label="清理孤儿文件"><i></i></button></div><div class="toggle-row" style="margin-top:8px;background:var(--amber-soft);border-color:#f1dfb8"><div class="toggle-copy"><strong>清理失败任务媒体</strong><span>超过保留期且所有关联任务均失败时删除</span></div><button class="switch" aria-label="清理失败任务媒体"><i></i></button></div><div class="config-actions"><button class="btn" id="resetBtn">恢复默认</button><button class="btn primary" id="saveBtn"><i data-lucide="save"></i>保存配置</button></div></div></section></div></div>`}
    function history(){return head('Storage / Cleanup / History','执行历史','每次定时或手工清理都会记录执行时间、来源、结果、删除文件和释放空间。点击一行查看文件明细。','<button class="btn" id="backMedia"><i data-lucide="arrow-left"></i>返回媒体清理</button>')+`<section class="panel history-page"><div class="panel-head"><div><div class="panel-title">媒体清理执行记录</div><div class="panel-copy">默认保留最近 30 次记录，支持按来源和结果筛选。</div></div><div class="history-filters"><select><option>全部来源</option><option>定时任务</option><option>手工执行</option></select><select><option>全部结果</option><option>已完成</option><option>部分完成</option></select></div></div><table class="history-table"><thead><tr><th>执行时间</th><th>来源</th><th>结果</th><th>删除文件</th><th>释放空间</th><th></th></tr></thead><tbody>${state.history.map(h=>`<tr><td><strong>${h.time.slice(0,10)}</strong><span class="table-sub">${h.time.slice(11)}</span></td><td>${h.source}</td><td><span class="result ${h.result}"><i></i>${h.label}</span></td><td>${h.deleted} 个</td><td>${h.bytes}</td><td><button class="table-link" data-history="${h.id}">查看详情</button></td></tr>`).join('')}</tbody></table><div class="table-foot"><span>共 ${state.history.length} 次执行</span><span>记录按时间倒序排列</span></div></section></div>`}
    function render(){const names={setup:'开始使用',connectors:'连接器',prompts:'提示词模板',models:'模型服务与转录',media:'媒体清理'};$('#crumb').textContent=state.historyView?'执行历史':names[state.view];content.innerHTML=state.historyView?history():state.view==='setup'?setup():state.view==='connectors'?connectors():state.view==='prompts'?prompts():state.view==='models'?models():media();document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',!state.historyView&&b.dataset.view===state.view));bind();lucide.createIcons()}
    function bind(){document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{state.view=b.dataset.view;state.historyView=false;render()});document.querySelectorAll('[data-cap]').forEach(b=>b.onclick=()=>{state.capFilter=b.dataset.cap;render()});document.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>{state.view=b.dataset.jump;state.historyView=false;render()});$('#historyBtn')?.addEventListener('click',()=>{state.historyView=true;render()});$('#historyBtn2')?.addEventListener('click',()=>{state.historyView=true;render()});$('#backMedia')?.addEventListener('click',()=>{state.historyView=false;state.view='media';render()});$('#scheduleToggle')?.addEventListener('click',()=>{state.schedule=!state.schedule;render()});$('#saveBtn')?.addEventListener('click',()=>toast('清理配置已保存'));$('#resetBtn')?.addEventListener('click',()=>toast('已恢复默认策略'));$('#connectorSave')?.addEventListener('click',()=>toast('连接器配置已保存'));$('#modelSave')?.addEventListener('click',()=>toast('模型配置已保存'));$('#refreshBtn')?.addEventListener('click',()=>toast('已完成最新文件盘点'));$('#runBtn')?.addEventListener('click',runCleanup);document.querySelectorAll('[data-history]').forEach(b=>b.onclick=()=>openDetail(state.history.find(h=>h.id===b.dataset.history)));$('#backBtn').onclick=()=>toast('原型演示：这里会返回应用入口')}
    function runCleanup(){const now=new Date();const pad=n=>String(n).padStart(2,'0');const time=`${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}`;state.history.unshift({id:'cleanup-'+Date.now(),source:'手工执行',time,result:'success',label:'已完成',deleted:48,bytes:'7.8 GB',files:['meeting-2026-07-11.mp4','course-demo-0712.mov','voice-memo-0714.m4a','+ 45 个文件']});state.historyView=true;render();toast('清理完成：删除 48 个文件，释放 7.8 GB')}
    function openDetail(h){if(!h)return;$('#drawerCopy').textContent=`${h.source} · ${h.time} · 执行编号 ${h.id}`;$('#drawerBody').innerHTML=`<div class="detail-grid"><div class="detail-stat"><b>${h.deleted}</b><span>删除文件</span></div><div class="detail-stat"><b>${h.bytes}</b><span>释放空间</span></div><div class="detail-stat"><b class="result ${h.result}" style="font-size:12px">${h.label}</b><span>执行结果</span></div></div><div class="section-label" style="margin-top:17px">文件明细</div><div class="detail-files">${h.files.map(f=>`<div class="detail-file"><strong>${f}</strong><span>${h.result==='partial'&&f===h.failed?'删除失败：文件正在使用':'已删除 · 按保留期策略匹配'}</span></div>`).join('')}</div>${h.failed?`<div class="notice" style="margin-top:13px;color:#966b1c;background:var(--amber-soft)"><i data-lucide="triangle-alert" style="width:12px;height:12px;vertical-align:-2px"></i> 失败文件会在下次任务中重新检查。</div>`:''}`;$('#drawerBackdrop').classList.add('show');lucide.createIcons()}
    function toast(msg){const el=$('#toast');el.textContent=msg;el.classList.add('show');clearTimeout(window.__toast);window.__toast=setTimeout(()=>el.classList.remove('show'),2100)}
    $('#drawerClose').onclick=()=>$('#drawerBackdrop').classList.remove('show');$('#drawerClose2').onclick=()=>$('#drawerBackdrop').classList.remove('show');$('#drawerBackdrop').onclick=e=>{if(e.target.id==='drawerBackdrop')$('#drawerBackdrop').classList.remove('show')};render();
  </script>
</body>
</html>
