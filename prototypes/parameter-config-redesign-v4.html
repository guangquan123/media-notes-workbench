<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>参数配置 · 紧凑布局原型 v4</title>
  <style>
    :root { --bg:#f5f7f9; --surface:#fff; --ink:#16191d; --muted:#69727e; --quiet:#9aa3ad; --line:#e3e7ec; --blue:#2563eb; --blue-soft:#eef4ff; --green:#16845e; --green-soft:#eaf8f1; --amber:#a66e1c; --amber-soft:#fff7e7; --red:#c14444; --red-soft:#fff0f0; --radius:12px; --shadow:0 10px 26px rgba(20,31,48,.055); }
    * { box-sizing:border-box; }
    html,body { margin:0; min-height:100%; background:var(--bg); color:var(--ink); font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif; }
    button,input,select { font:inherit; }
    button { cursor:pointer; }
    .app { min-height:100vh; display:grid; grid-template-columns:220px minmax(0,1fr); }
    .rail { border-right:1px solid var(--line); background:#fbfcfd; padding:16px 13px; display:flex; flex-direction:column; gap:16px; }
    .brand { height:38px; display:flex; align-items:center; gap:10px; padding:0 8px 14px; border-bottom:1px solid var(--line); }
    .brand-mark { width:32px; height:32px; display:grid; place-items:center; border-radius:9px; background:#111315; color:#fff; font-size:15px; font-weight:800; }
    .brand-title { font-size:14px; font-weight:750; }.brand-sub { margin-top:2px; color:var(--quiet); font-size:10px; }
    .rail-label { padding:0 8px; color:var(--quiet); font-size:10px; font-weight:700; letter-spacing:.08em; }
    .nav { display:grid; gap:5px; }.nav button { width:100%; display:flex; gap:10px; align-items:flex-start; padding:11px 10px; border:1px solid transparent; border-radius:10px; background:transparent; color:#59636f; text-align:left; }
    .nav button:hover { border-color:var(--line); background:#fff; }.nav button.active { border-color:#111315; background:#111315; color:#fff; box-shadow:0 8px 17px rgba(17,19,21,.13); }
    .nav-icon { width:17px; flex:none; margin-top:1px; text-align:center; font-size:14px; }.nav-title { display:block; font-size:12px; font-weight:720; }.nav-desc { display:block; margin-top:4px; color:#9aa2ac; font-size:10px; line-height:1.45; }.nav button.active .nav-desc { color:rgba(255,255,255,.58); }
    .rail-foot { margin-top:auto; padding:10px 8px 0; border-top:1px solid var(--line); color:var(--quiet); font-size:10px; line-height:1.55; }
    .main { min-width:0; }.topbar { height:52px; display:flex; align-items:center; justify-content:space-between; gap:14px; padding:0 22px; border-bottom:1px solid var(--line); background:rgba(255,255,255,.96); position:sticky; top:0; z-index:4; }
    .breadcrumb { min-width:0; display:flex; align-items:center; gap:8px; color:var(--quiet); font-size:11px; white-space:nowrap; }.breadcrumb strong { color:#39414c; font-weight:720; }.top-actions { display:flex; align-items:center; gap:7px; }
    .page { max-width:1260px; margin:0 auto; padding:17px 22px 40px; }.page-head { display:flex; justify-content:space-between; align-items:center; gap:16px; margin-bottom:14px; }.page-head h1 { margin:0; font-size:22px; letter-spacing:-.035em; }.page-head p { margin:4px 0 0; color:var(--muted); font-size:11px; line-height:1.5; }.head-actions { display:flex; align-items:center; gap:7px; }
    .btn { min-height:31px; display:inline-flex; align-items:center; justify-content:center; gap:6px; padding:0 10px; border:1px solid var(--line); border-radius:8px; background:#fff; color:#58636f; font-size:11px; }.btn:hover { border-color:#c3cedb; background:#f8fafc; color:var(--ink); }.btn.primary { border-color:var(--blue); background:var(--blue); color:#fff; }.btn.danger { border-color:#efc1c1; background:var(--red-soft); color:#b03b3b; }.btn:disabled { cursor:not-allowed; opacity:.43; }.icon { width:14px; text-align:center; font-size:14px; line-height:1; }
    .pill { display:inline-flex; align-items:center; gap:6px; padding:5px 8px; border:1px solid #d4eadf; border-radius:8px; background:#f3fbf7; color:#247653; font-size:10px; font-weight:700; white-space:nowrap; }.dot { width:6px; height:6px; border-radius:50%; background:#18a876; }.panel { border:1px solid var(--line); border-radius:var(--radius); background:var(--surface); box-shadow:var(--shadow); }.panel-head { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:14px 17px; border-bottom:1px solid var(--line); }.panel-title { font-size:13px; font-weight:740; }.panel-copy { margin-top:3px; color:var(--muted); font-size:10px; line-height:1.5; }.panel-body { padding:16px 17px; }.grid { display:grid; gap:12px; }
    .connector-grid { display:grid; grid-template-columns:190px minmax(0,1fr); gap:13px; }.switch-list { padding:9px; }.switch-item { width:100%; margin-bottom:5px; padding:11px 10px; border:1px solid transparent; border-radius:9px; background:#fff; color:var(--ink); text-align:left; }.switch-item.active { border-color:#c7d6fa; background:var(--blue-soft); }.switch-item strong { display:block; font-size:12px; }.switch-item span { display:block; margin-top:4px; color:var(--muted); font-size:10px; }.connector-main { display:grid; gap:13px; }.status-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }.status-box { padding:14px; border:1px solid var(--line); border-radius:10px; }.status-box strong { font-size:12px; }.status-box p { margin:6px 0 11px; color:var(--muted); font-size:10px; line-height:1.5; }.field-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }.field { display:grid; gap:6px; }.field.full { grid-column:1/-1; }.field label { color:#626d79; font-size:10px; font-weight:680; }.field input,.field select { width:100%; height:34px; padding:0 9px; border:1px solid #dfe4ea; border-radius:8px; background:#fff; color:var(--ink); font-size:11px; }.inline-actions { display:flex; justify-content:flex-end; gap:7px; margin-top:14px; padding-top:13px; border-top:1px solid var(--line); }
    .media-summary { display:grid; grid-template-columns:1.12fr .88fr; gap:13px; }.stats { display:grid; grid-template-columns:repeat(4,1fr); gap:9px; padding:14px 17px; }.stat { padding:11px; border:1px solid var(--line); border-radius:9px; background:#fbfcfd; }.stat small { color:var(--quiet); font-size:10px; }.stat b { display:block; margin-top:6px; font-size:18px; }.stat em { display:block; margin-top:3px; color:var(--quiet); font-size:9px; font-style:normal; }.toggle { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:11px 12px; border:1px solid var(--line); border-radius:9px; background:#fbfcfd; }.toggle strong { display:block; font-size:11px; }.toggle span { display:block; margin-top:4px; color:var(--muted); font-size:10px; }.switch { width:35px; height:21px; padding:3px; border:0; border-radius:999px; background:#cbd2dc; }.switch i { display:block; width:15px; height:15px; border-radius:50%; background:#fff; transition:.16s; }.switch.on { background:var(--blue); }.switch.on i { transform:translateX(14px); }.preview-cta { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:14px 17px; border-top:1px solid var(--line); }.preview-cta strong { font-size:12px; }.preview-cta span { display:block; margin-top:4px; color:var(--muted); font-size:10px; }.preview-card { display:grid; gap:10px; }.file-row { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:11px 12px; border:1px solid var(--line); border-radius:9px; }.file-row strong { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:11px; }.file-row span { display:block; margin-top:4px; color:var(--muted); font-size:10px; }.file-size { color:#65707c; font-size:10px; white-space:nowrap; }
    .preview-toolbar { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 16px; border-bottom:1px solid var(--line); }.preview-list { display:grid; gap:8px; padding:12px 16px; }.pagination { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:11px 16px; border-top:1px solid var(--line); color:var(--quiet); font-size:10px; }.pagination div { display:flex; gap:7px; }
    .prompt-layout { display:grid; grid-template-columns:190px minmax(0,1fr); gap:13px; }.prompt-panel { min-width:0; }.version-list { display:grid; gap:7px; padding:12px 16px; }.version-row { display:grid; grid-template-columns:auto minmax(0,1fr) auto; align-items:center; gap:10px; padding:10px 11px; border:1px solid var(--line); border-radius:9px; }.version-row.current { border-color:#bfd3fc; background:#f7faff; }.version-row label { min-width:0; }.version-row strong { font-size:12px; }.version-row span { display:block; margin-top:4px; color:var(--muted); font-size:10px; }.version-row input { width:15px; height:15px; accent-color:var(--blue); }.version-row input:disabled { opacity:.35; }.version-actions { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:12px 16px; border-top:1px solid var(--line); }.version-actions small { color:var(--muted); font-size:10px; }.editor { min-height:350px; padding:15px; border:1px solid var(--line); border-radius:9px; background:#fbfcfd; color:#2d353f; font-family:ui-monospace,SFMono-Regular,Consolas,monospace; font-size:11px; line-height:1.85; white-space:pre-wrap; }
    .compare-summary { display:flex; align-items:center; justify-content:space-between; gap:14px; padding:13px 15px; border:1px solid #cadbff; border-radius:10px; background:var(--blue-soft); }.compare-summary h2 { margin:0; color:#1f4fae; font-size:13px; }.compare-summary p { margin:4px 0 0; color:#2864ea; font-size:10px; }.compare-counts { display:flex; align-items:center; gap:7px; flex-wrap:wrap; }.count { padding:6px 8px; border-radius:7px; font-size:10px; font-weight:700; }.count.add { background:#dff6e9; color:#17744f; }.count.remove { background:#ffe3e3; color:#a33b3b; }.count.change { background:#fff0c9; color:#8c6016; }.segmented { display:flex; gap:2px; padding:3px; border-radius:8px; background:#e4eaf2; }.segmented button { padding:6px 9px; border:0; border-radius:6px; background:transparent; color:#69727e; font-size:10px; }.segmented button.active { background:#111315; color:#fff; }.diff-layout { display:grid; grid-template-columns:minmax(0,1fr) 210px; gap:13px; }.diff-table { overflow:hidden; }.diff-head,.diff-row { display:grid; grid-template-columns:1fr 1fr; }.diff-head > div { padding:11px 13px; border-bottom:1px solid var(--line); background:#fafbfc; font-size:11px; font-weight:720; }.diff-head > div:last-child { background:var(--blue-soft); color:#2864ea; }.diff-row > div { min-width:0; min-height:34px; padding:8px 12px; border-bottom:1px solid #f0f2f4; font-family:ui-monospace,SFMono-Regular,Consolas,monospace; font-size:10px; line-height:1.5; white-space:pre-wrap; }.diff-row > div:first-child { border-right:1px solid var(--line); }.diff-row.add > div:last-child { background:#edfbf3; color:#176f4c; }.diff-row.remove > div:first-child { background:#fff0f0; color:#9d3b3b; }.diff-row.change > div { background:#fff8e6; color:#805c19; }.diff-row.context > div { color:#7f8994; }.diff-side { display:grid; gap:13px; align-content:start; }.diff-side .panel { box-shadow:none; }.change-item { width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:8px; background:#fff; text-align:left; }.change-item strong { display:block; font-size:10px; }.change-item span { display:block; overflow:hidden; margin-top:4px; color:var(--muted); font-size:9px; text-overflow:ellipsis; white-space:nowrap; }
    @media(max-width:900px){ .app{grid-template-columns:190px 1fr}.media-summary,.diff-layout{grid-template-columns:1fr}.diff-side{grid-template-columns:1fr 1fr}.stats{grid-template-columns:repeat(2,1fr)} }
    @media(max-width:680px){ .app{display:block}.rail{display:none}.topbar{height:48px;padding:0 12px}.top-actions .help{display:none}.page{padding:13px 12px 28px}.page-head{display:block}.head-actions{margin-top:10px}.connector-grid,.prompt-layout{grid-template-columns:1fr}.switch-list{display:flex;gap:6px;overflow:auto;padding:5px}.switch-item{min-width:145px;margin:0}.status-grid,.field-grid{grid-template-columns:1fr}.diff-side{grid-template-columns:1fr}.compare-summary{display:block}.compare-counts{margin-top:10px}.diff-table{overflow:auto}.diff-head,.diff-row{min-width:650px}.preview-toolbar{display:block}.preview-toolbar .head-actions{margin-top:8px} }
  </style>
</head>
<body>
  <div class="app">
    <aside class="rail">
      <div class="brand"><div class="brand-mark">⌘</div><div><div class="brand-title">参数配置</div><div class="brand-sub">媒体笔记工作台</div></div></div>
      <div class="rail-label">配置模块</div>
      <nav class="nav" id="nav">
        <button data-screen="setup"><span class="nav-icon">☷</span><span><span class="nav-title">开始使用</span><span class="nav-desc">自动检测环境与能力状态</span></span></button>
        <button data-screen="connectors" class="active"><span class="nav-icon">⌘</span><span><span class="nav-title">连接器</span><span class="nav-desc">飞书、钉钉协作能力</span></span></button>
        <button data-screen="prompts"><span class="nav-icon">▤</span><span><span class="nav-title">提示词模板</span><span class="nav-desc">编辑、发布与版本比较</span></span></button>
        <button data-screen="models"><span class="nav-icon">▱</span><span><span class="nav-title">模型服务与转录</span><span class="nav-desc">提供者、模型和转录方式</span></span></button>
        <button data-screen="media"><span class="nav-icon">▣</span><span><span class="nav-title">媒体清理</span><span class="nav-desc">清理策略与预览记录</span></span></button>
      </nav>
      <div class="rail-foot">原型说明：顶部采用紧凑工具栏，页面内容从第一屏开始。<br/>不改变现有业务字段和操作。</div>
    </aside>
    <main class="main">
      <header class="topbar"><div class="breadcrumb"><span>工作台</span><span>/</span><span>参数配置</span><span>/</span><strong id="crumb">连接器</strong></div><div class="top-actions"><span class="pill"><i class="dot"></i>本地运行正常</span><button class="btn" id="backBtn"><span class="icon">←</span>返回入口</button></div></header>
      <div id="content"></div>
    </main>
  </div>
  <div class="toast" id="toast"></div>
  <script>
    const state={screen:'connectors',preview:false,compare:false,viewMode:'changes',selected:[1,2],page:1};
    const pages={setup:'开始使用',connectors:'连接器',prompts:'提示词模板',models:'模型服务与转录',media:'媒体清理'};
    const files=[['meeting-2026-07-11.mp4','孤儿文件 · 未被任务引用','1.24 GB'],['course-demo-0712.mov','关联任务均失败 · 保留期已满','894 MB'],['voice-memo-0714.m4a','孤儿文件 · 修改于 2026-07-14','86 MB'],['screen-record-0629.webm','关联任务均失败 · 保留期已满','642 MB'],['weekly-review-0621.mp4','孤儿文件 · 修改于 2026-06-21','518 MB'],['interview-0622.m4a','关联任务均失败 · 保留期已满','304 MB'],['demo-0623.mov','孤儿文件 · 修改于 2026-06-23','276 MB'],['research-sync-0628.mp4','关联任务均失败 · 保留期已满','1.08 GB'],['archive-old-0627.mp4','孤儿文件 · 未被任务引用','923 MB'],['voice-note-0625.m4a','孤儿文件 · 修改于 2026-06-25','74 MB'],['lesson-0619.mov','关联任务均失败 · 保留期已满','412 MB']];
    const diffRows=[['目标：保留原始材料中的完整信息。','目标：保留原始材料中的完整信息。','context'],['完整记录数字、版本、价格、时间和参数。','完整记录数字、版本、价格、时间和参数。','context'],['输出结构化的学习笔记，便于复习。','输出结构化、可检索、可复用的学习笔记。','change'],['','新增：不确定内容标记【待人工确认】。','add'],['旧内容不再适用。','','remove'],['按主题组织内容并给出行动项。','按主题组织内容，并给出下一步行动项。','change']];
    function button(text,cls='',id=''){return `<button class="btn ${cls}" ${id?`id="${id}"`:''}>${text}</button>`}
    function head(title,copy,actions=''){return `<div class="page"><div class="page-head"><div><h1>${title}</h1><p>${copy}</p></div><div class="head-actions">${actions}</div></div>`}
    function connectors(){return head('连接器','保持原有连接器能力，仅将授权、测试和通知设置压缩到连续工作区。',`<span class="pill"><i class="dot"></i>当前使用：飞书</span>`)+`<div class="connector-grid"><section class="panel switch-list"><button class="switch-item active"><strong>飞书</strong><span>笔记和待办同步到飞书</span></button><button class="switch-item"><strong>钉钉</strong><span>已连接，可切换</span></button></section><div class="connector-main"><section class="panel"><div class="panel-head"><div><div class="panel-title">飞书连接器</div><div class="panel-copy">当前唯一输出位置 · 授权状态和连接测试</div></div>${button('返回设置')}</div><div class="panel-body"><div class="status-grid"><div class="status-box"><strong>授权状态</strong><p>当前授权人：张敏 · 最近验证：今天 09:38</p>${button('重新授权')}</div><div class="status-box"><strong>连接测试</strong><p>最近一次测试成功 · 延迟 428 ms</p>${button('测试连接')}</div></div></div></section><section class="panel"><div class="panel-head"><div><div class="panel-title">通知设置</div><div class="panel-copy">按原有场景配置通知，不增加新的业务选项。</div></div></div><div class="panel-body"><div class="field-grid"><div class="field"><label>通知方式</label><select><option>飞书群机器人</option><option>个人会话</option></select></div><div class="field"><label>Webhook 地址</label><input value="https://open.feishu.cn/open-apis/bot/v2/hook/…" /></div><div class="field full"><label>Webhook Secret（可选）</label><input type="password" value="feishu-secret" /></div></div><div class="inline-actions">${button('取消')}${button('保存连接器','primary','saveConnector')}</div></div></section></div></div></div>`}
    function models(){return head('模型服务与转录','保持现有提供者、模型和转录配置，仅压缩页面顶部和分组间距。',button('保存配置','primary'))+`<div class="grid"><section class="panel"><div class="panel-head"><div><div class="panel-title">模型服务提供者</div><div class="panel-copy">已有提供者保持原字段和操作。</div></div>${button('+ 新增提供者','primary')}</div><div class="panel-body grid"><div class="file-row"><div><strong>公司内部模型 API</strong><span>https://api.example.com/v1 · API Key 已保存</span></div><span class="pill">已启用</span></div><div class="file-row"><div><strong>腾讯云 ASR</strong><span>腾讯云转录资源包 · 已配置</span></div><span class="pill">已启用</span></div></div></section><section class="panel"><div class="panel-head"><div><div class="panel-title">模型配置</div><div class="panel-copy">一次性选择转录方式、转录模型和总结模型。</div></div></div><div class="panel-body"><div class="field-grid"><div class="field"><label>转录方式</label><select><option>我的 API 模型</option><option>腾讯 ASR</option></select></div><div class="field"><label>转录模型</label><select><option>whisper-large-v3</option><option>paraformer-v2</option></select></div><div class="field"><label>总结模型提供者</label><select><option>公司内部模型 API</option><option>OpenAI 兼容 API</option></select></div><div class="field"><label>总结模型</label><select><option>deepseek-chat</option><option>gpt-4.1-mini</option></select></div></div><div class="inline-actions">${button('保存模型配置','primary')}</div></div></section></div></div>`}
    function media(){return head('媒体清理','先看清理策略和统计，文件明细通过独立预览页查看，避免主页面过长。',`${button('查看执行历史')} ${button('保存配置','primary')}`)+`<div class="media-summary"><div class="grid"><section class="panel"><div class="panel-head"><div><div class="panel-title">清理概览</div><div class="panel-copy">只清理达到保留期且未被运行中任务使用的本地媒体。</div></div>${button('刷新盘点')}</div><div class="stats"><div class="stat"><small>媒体文件</small><b>126</b><em>全部目录</em></div><div class="stat"><small>占用空间</small><b>38.6 GB</b><em>本周 +1.8 GB</em></div><div class="stat"><small>本次可清理</small><b style="color:var(--red)">48</b><em>超过 30 天</em></div><div class="stat"><small>预计释放</small><b style="color:var(--green)">7.8 GB</b><em>按最新盘点</em></div></div><div class="preview-cta"><div><strong>本次清理预览</strong><span>明细已移至独立页面，共 48 个文件符合清理条件。</span></div>${button('查看可清理明细','primary','openPreview')}</div></section></div><section class="panel"><div class="panel-head"><div><div class="panel-title">清理策略</div><div class="panel-copy">保存后对定时和手工执行同时生效。</div></div><span class="pill"><i class="dot"></i>定时已启用</span></div><div class="panel-body grid"><div class="toggle"><div><strong>启用定时清理</strong><span>关闭时仍可预览并手工执行清理</span></div><button class="switch on"><i></i></button></div><div class="field-grid"><div class="field"><label>执行周期</label><select><option>每周</option><option>每天</option><option>每月</option></select></div><div class="field"><label>执行时间</label><input type="time" value="03:00" /></div><div class="field"><label>媒体保留天数</label><input type="number" value="30" /></div><div class="field"><label>每周执行日</label><select><option>星期日</option><option>星期一</option></select></div></div><div class="toggle"><div><strong>清理孤儿文件</strong><span>没有任何笔记记录引用的文件</span></div><button class="switch on"><i></i></button></div><div class="toggle" style="background:var(--amber-soft);border-color:#f1dfb8"><div><strong>清理失败任务媒体</strong><span>超过保留期且所有关联任务均失败时删除</span></div><button class="switch"><i></i></button></div></div></section></div></div>`}
    function preview(){const start=(state.page-1)*5;return head('可清理媒体预览','独立展示盘点明细，支持分页查看，不改变清理策略和执行逻辑。',button('← 返回媒体清理','','backMedia'))+`<section class="panel"><div class="preview-toolbar"><div><div class="panel-title">可清理文件明细</div><div class="panel-copy">当前显示第 ${start+1}—${Math.min(start+5,files.length)} 项，共 ${files.length} 个文件。</div></div><div class="head-actions">${button('刷新盘点')}${button('手工执行清理','danger')}</div></div><div class="preview-list">${files.slice(start,start+5).map(f=>`<div class="file-row"><div><strong>${f[0]}</strong><span>${f[1]}</span></div><span class="file-size">${f[2]}</span></div>`).join('')}</div><div class="pagination"><span>第 ${state.page} / ${Math.ceil(files.length/5)} 页</span><div>${button('上一页','','prevPage')}${button('下一页','','nextPage')}</div></div></section></div>`}
    function prompts(){return head('提示词模板','编辑器保持原有内容；版本管理改为先勾选，再查看差异。',button('发布生效','primary'))+`<div class="prompt-layout"><section class="panel switch-list"><button class="switch-item active"><strong>学习笔记</strong><span>课程、书籍、报告、技术资料</span></button><button class="switch-item"><strong>会议纪要</strong><span>录音、访谈、项目同步</span></button></section><div class="grid"><section class="panel prompt-panel"><div class="panel-head"><div><div class="panel-title">学习笔记</div><div class="panel-copy">发布后才会传给 AI；草稿可以继续修改。</div></div>${button('版本管理','','openVersions')}</div><div class="panel-body"><div class="editor">目标：把原始材料整理成详细、准确、可复习、可检索的学习笔记。\n\n一、真实性与完整性\n1. 只能使用原文和系统提供的证据账本。\n2. 完整保留数字、版本、价格、时间、参数和步骤。\n3. 不确定内容标记【待人工确认】。</div></div></section><section class="panel" id="versions"><div class="panel-head"><div><div class="panel-title">版本管理</div><div class="panel-copy">每个版本前直接勾选；最多同时选择两个版本。</div></div><span class="pill" id="selectedCount">已选择 0 / 2</span></div><div class="version-list">${[3,2,1].map((v,i)=>`<div class="version-row ${v===3?'current':''}"><input type="checkbox" data-version="${v}" ${state.selected.includes(v)?'checked':''} ${state.selected.length===2&&!state.selected.includes(v)?'disabled':''}/><label><strong>V${v} ${v===3?'· 当前生效':''}</strong><span>2026-08-${28-i*4} · ${v===3?'1,420':'1,3'+v+'0'} 字符</span></label>${button('查看内容')}</div>`).join('')}</div><div class="version-actions"><small>勾选两个版本后才能比较，第三个会自动禁用。</small>${button('查看差异','primary','compareBtn')}</div></section></div></div>`}
    function compare(){return head('提示词版本比较',`V2 与 V3 · 学习笔记 · 只读查看`,button('← 返回提示词','','backPrompt'))+`<div class="compare-summary"><div><h2>差异结果</h2><p>比较引擎已按相同内容对齐，仅突出新增、删除和修改。</p></div><div class="compare-counts"><span class="count add">新增 1</span><span class="count remove">删除 1</span><span class="count change">修改 2</span><div class="segmented"><button class="${state.viewMode==='changes'?'active':''}" id="changesMode">只看差异</button><button class="${state.viewMode==='all'?'active':''}" id="allMode">展示全部</button></div></div></div><div class="diff-layout" style="margin-top:13px"><section class="panel diff-table"><div class="diff-head"><div>V2 · 旧版本</div><div>V3 · 当前生效</div></div>${diffRows.filter(r=>state.viewMode==='all'||r[2]!=='context').map(r=>`<div class="diff-row ${r[2]}"><div>${r[0]||' '}</div><div>${r[1]||' '}</div></div>`).join('')}</section><aside class="diff-side"><section class="panel"><div class="panel-head"><div class="panel-title">改动导航</div></div><div class="panel-body grid"><button class="change-item"><strong>修改 · 第 1 处</strong><span>输出结构化、可检索、可复用…</span></button><button class="change-item"><strong>新增 · 第 2 处</strong><span>不确定内容标记【待人工确认】</span></button><button class="change-item"><strong>删除 · 第 3 处</strong><span>旧内容不再适用</span></button></div></section><section class="panel"><div class="panel-body" style="color:var(--muted);font-size:10px;line-height:1.6">当前生效版本：<strong style="color:var(--ink)">V3</strong><br/>比较仅用于查看，不会自动发布。</div></section></aside></div></div>`}
    function setup(){return head('开始使用','查看当前能力状态，入口保持原有模块路径。','<span class="pill"><i class="dot"></i>4 / 6 项能力已就绪</span>')+`<div class="media-summary"><section class="panel" style="padding:18px;background:#181c22;color:#fff"><div style="color:#8fb4ff;font-size:10px;font-weight:700">SYSTEM CHECK</div><h2 style="margin:12px 0 6px;font-size:20px">环境检查已完成</h2><p style="margin:0;color:rgba(255,255,255,.63);font-size:11px;line-height:1.6">本地运行时和媒体目录正常，连接器保持当前配置。转录服务还需要补充配置。</p></section><section class="panel"><div class="panel-head"><div><div class="panel-title">最近一次检查</div><div class="panel-copy">今天 09:42 · 本地运行时</div></div></div><div class="panel-body grid"><div class="toggle"><strong>本地运行时</strong><span class="pill">正常</span></div><div class="toggle"><strong>媒体目录读写</strong><span class="pill">正常</span></div><div class="toggle"><strong>转录服务</strong><span style="color:var(--amber)">待配置</span></div></div></section></div></div>`}
    function render(){const screen=state.compare?'compare':state.preview?'preview':state.screen;document.getElementById('crumb').textContent=screen==='preview'?'媒体清理预览':screen==='compare'?'版本比较':pages[screen];document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',!state.preview&&!state.compare&&b.dataset.screen===state.screen));document.getElementById('content').innerHTML=screen==='connectors'?connectors():screen==='models'?models():screen==='media'?media():screen==='prompts'?prompts():screen==='preview'?preview():screen==='compare'?compare():setup();bind();}
    function bind(){document.querySelectorAll('[data-screen]').forEach(b=>b.onclick=()=>{state.screen=b.dataset.screen;state.preview=false;state.compare=false;state.page=1;render();});document.getElementById('openPreview')?.addEventListener('click',()=>{state.preview=true;render();});document.getElementById('backMedia')?.addEventListener('click',()=>{state.preview=false;state.screen='media';render();});document.getElementById('prevPage')?.addEventListener('click',()=>{state.page=Math.max(1,state.page-1);render();});document.getElementById('nextPage')?.addEventListener('click',()=>{state.page=Math.min(Math.ceil(files.length/5),state.page+1);render();});document.getElementById('openVersions')?.addEventListener('click',()=>document.getElementById('versions')?.scrollIntoView({behavior:'smooth'}));document.querySelectorAll('[data-version]').forEach(input=>input.addEventListener('change',e=>{const id=Number(e.target.dataset.version);state.selected=e.target.checked?[...state.selected,id].filter((v,i,a)=>a.indexOf(v)===i):state.selected.filter(v=>v!==id);render();}));document.getElementById('compareBtn')?.addEventListener('click',()=>{if(state.selected.length===2){state.compare=true;state.preview=false;render();}});document.getElementById('backPrompt')?.addEventListener('click',()=>{state.compare=false;state.screen='prompts';render();});document.getElementById('changesMode')?.addEventListener('click',()=>{state.viewMode='changes';render();});document.getElementById('allMode')?.addEventListener('click',()=>{state.viewMode='all';render();});document.getElementById('backBtn').onclick=()=>toast('原型演示：返回工作台入口');document.getElementById('saveConnector')?.addEventListener('click',()=>toast('原型演示：连接器配置已保存'));}
    function toast(message){const el=document.getElementById('toast');el.textContent=message;el.classList.add('show');clearTimeout(window.__toast);window.__toast=setTimeout(()=>el.classList.remove('show'),1800);}
    const style=document.createElement('style');style.textContent='.toast{position:fixed;left:50%;bottom:22px;z-index:9;transform:translate(-50%,10px);padding:9px 13px;border-radius:8px;background:#111315;color:#fff;font-size:11px;opacity:0;pointer-events:none;transition:.18s}.toast.show{transform:translate(-50%,0);opacity:1}';document.head.appendChild(style);render();
  </script>
</body>
</html>
