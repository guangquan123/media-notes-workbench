<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>录音记录 · 完整播放器原型</title>
<style>
:root{--bg:#f4f6f9;--white:#fff;--ink:#121a2a;--muted:#69758a;--line:#e4e9f0;--blue:#2864e8;--soft:#edf3ff;--navy:#111b32;--green:#18b889;--amber:#9a5a00;font-family:Inter,"Segoe UI","Microsoft YaHei",sans-serif;color:var(--ink)}*{box-sizing:border-box}body{margin:0;background:var(--bg)}button,input,select{font:inherit}button{cursor:pointer}svg{display:block}.view{display:none;min-height:100vh}.view.active{display:block}.wrap{width:min(1320px,calc(100% - 40px));margin:auto}.bar{height:62px;border-bottom:1px solid var(--line);background:#fff}.bar .wrap{height:100%;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:10px;font-weight:800}.logo{width:32px;height:32px;display:grid;place-items:center;border-radius:9px;background:var(--blue);color:#fff}.actions{display:flex;gap:8px}.btn{height:38px;padding:0 14px;border:1px solid var(--line);border-radius:9px;background:#fff;color:#344054;font-size:13px;font-weight:700}.btn.primary{border-color:var(--blue);background:var(--blue);color:#fff}.library{padding:28px 0}.head{display:flex;align-items:end;justify-content:space-between;margin-bottom:20px}.head h1{margin:0;font-size:30px;letter-spacing:-.04em}.head p{margin:7px 0 0;color:var(--muted);font-size:14px}.stats{display:flex;gap:25px;color:var(--muted);font-size:12px}.stats strong{display:block;color:var(--ink);font-size:18px}.notice{margin-bottom:13px;padding:13px 15px;display:flex;justify-content:space-between;border:1px solid #eed590;border-radius:11px;background:#fff9e9;color:#744b00;font-size:13px}.panel{overflow:hidden;border:1px solid var(--line);border-radius:13px;background:#fff;box-shadow:0 14px 40px rgba(22,34,58,.06)}.toolbar{padding:12px;display:grid;grid-template-columns:1fr 170px 150px;gap:8px;border-bottom:1px solid var(--line)}.toolbar input,.toolbar select{height:40px;border:1px solid var(--line);border-radius:9px;padding:0 12px;background:#fff}.table-head,.record{display:grid;grid-template-columns:minmax(300px,1fr) 100px 120px 110px 44px;gap:14px;align-items:center}.table-head{height:38px;padding:0 18px;background:#fafbfc;color:#98a2b3;font-size:11px;font-weight:800}.record{min-height:76px;padding:12px 18px;border-top:1px solid #edf0f4}.record:hover{background:#f8faff}.main{min-width:0;display:grid;grid-template-columns:40px 1fr;gap:12px;align-items:center}.file-icon{width:40px;height:40px;display:grid;place-items:center;border-radius:10px;background:var(--soft);color:var(--blue)}.title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px;font-weight:800}.meta{margin-top:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);font-size:12px}.cell{color:#536076;font-size:12px}.pill{width:max-content;padding:5px 9px;border-radius:99px;background:#fff5da;color:var(--amber);font-size:11px;font-weight:800}.pill.done{background:#e9f8f3;color:#087c5e}.row-play{width:36px;height:36px;display:grid;place-items:center;border:1px solid #cedaf2;border-radius:50%;background:#fff;color:var(--blue)}.record:hover .row-play{border-color:var(--blue);background:var(--blue);color:#fff}.foot{height:44px;padding:0 18px;display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--line);color:var(--muted);font-size:12px}
.player{background:var(--navy);color:#f8fafc}.player-bar{height:68px;border-bottom:1px solid rgba(255,255,255,.09)}.player-bar .wrap{height:100%;display:flex;align-items:center;justify-content:space-between}.back,.dark-btn{height:38px;padding:0 11px;display:flex;align-items:center;gap:7px;border:1px solid transparent;border-radius:9px;background:transparent;color:#c6d0df;font-weight:700}.back:hover,.dark-btn:hover{background:rgba(255,255,255,.08);color:#fff}.dark-btn{border-color:rgba(255,255,255,.12);font-size:12px}.player-shell{width:min(1120px,calc(100% - 40px));margin:auto;padding:50px 0}.player-title{text-align:center}.kicker{display:flex;align-items:center;justify-content:center;gap:9px;color:#8493aa;font-size:11px;font-weight:800;letter-spacing:.1em}.live-dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 5px rgba(24,184,137,.1)}.player-title h1{margin:14px 0 8px;font-size:clamp(27px,3vw,38px);letter-spacing:-.04em}.player-title p{margin:0;color:#8b9ab1;font-size:13px}.wave-card{margin-top:40px;padding:32px 36px 27px;border:1px solid rgba(255,255,255,.09);border-radius:22px;background:#17233d;box-shadow:0 28px 70px rgba(0,0,0,.28)}.wave-wrap{position:relative;height:180px;display:flex;align-items:center;cursor:pointer}.wave{position:absolute;inset:0;display:flex;align-items:center;gap:3px}.wave i{flex:1;min-width:2px;border-radius:99px;background:#35445f}.wave i.played{background:linear-gradient(#75adff,#2864e8)}.playhead{position:absolute;top:5px;bottom:5px;left:0;width:2px;background:#fff;box-shadow:0 0 0 4px rgba(255,255,255,.12)}.time{display:flex;justify-content:space-between;color:#8c9bb1;font-size:12px}.controls{margin-top:23px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center}.side-control{display:flex;gap:5px}.side-control.right{justify-content:flex-end}.control{height:38px;padding:0 10px;border:0;border-radius:9px;background:transparent;color:#aeb9ca;font-size:12px;font-weight:800}.control:hover{background:rgba(255,255,255,.08);color:#fff}.transport{display:flex;align-items:center;gap:15px}.jump{width:46px;height:46px;border:0;border-radius:50%;background:rgba(255,255,255,.07);color:#dde5f2}.main-play{width:66px;height:66px;display:grid;place-items:center;border:0;border-radius:50%;background:#fff;color:var(--blue);box-shadow:0 12px 30px rgba(0,0,0,.25)}.speed{position:relative}.speed-pop{position:absolute;right:0;bottom:43px;width:92px;padding:6px;display:none;border-radius:10px;background:#26334b}.speed.open .speed-pop{display:grid}.speed-pop button{height:30px;border:0;border-radius:6px;background:transparent;color:#b8c3d4}.speed-pop button:hover,.speed-pop button.active{background:rgba(255,255,255,.1);color:#fff}.info-grid{margin-top:16px;display:grid;grid-template-columns:1.35fr .65fr;gap:14px}.info-card{padding:20px;border:1px solid rgba(255,255,255,.08);border-radius:15px;background:rgba(255,255,255,.035)}.info-card h2{margin:0 0 17px;font-size:14px}.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.fact span{display:block;color:#71809a;font-size:11px}.fact strong{display:block;margin-top:5px;color:#dce5f2;font-size:13px}.source{margin-top:17px;padding-top:15px;display:flex;justify-content:space-between;gap:10px;border-top:1px solid rgba(255,255,255,.07)}.source div{min-width:0}.source strong{font-size:12px}.source span{display:block;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#71809a;font-size:11px}.next-action{display:flex;flex-direction:column}.next-action p{margin:0;color:#8b9ab1;font-size:12px;line-height:1.65}.convert{height:44px;margin-top:auto;border:0;border-radius:10px;background:var(--blue);color:#fff;font-weight:800}.nextbar{margin-top:18px;display:flex;justify-content:space-between}.next{max-width:45%;padding:8px;border:0;border-radius:8px;background:transparent;color:#8b9ab1}.next:hover{background:rgba(255,255,255,.05);color:#fff}.toast{position:fixed;left:50%;bottom:24px;padding:10px 14px;transform:translate(-50%,15px);border-radius:8px;background:#fff;color:#172033;font-size:12px;font-weight:700;opacity:0;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:800px){.table-head{display:none}.record{grid-template-columns:1fr 70px 40px}.record .status,.record .archive{display:none}.toolbar{grid-template-columns:1fr 1fr}.toolbar input{grid-column:1/-1}.controls{grid-template-columns:1fr}.transport{grid-row:1;justify-content:center}.side-control{margin-top:15px;justify-content:center}.side-control.right{justify-content:center}.info-grid{grid-template-columns:1fr}.next-action{gap:15px}.wave-wrap{height:135px}}@media(max-width:520px){.wrap,.player-shell{width:calc(100% - 24px)}.stats{display:none}.toolbar{grid-template-columns:1fr}.toolbar input{grid-column:auto}.record{grid-template-columns:1fr 38px;padding:11px 12px}.record>.cell{display:none}.wave-card{padding:20px 16px;border-radius:16px}.side-control:first-child{display:none}.facts{grid-template-columns:1fr 1fr}}
</style></head><body>
<section class="view active" id="library"><header class="bar"><div class="wrap"><div class="brand"><span class="logo">⌕</span>录音记录</div><div class="actions"><button class="btn">返回工作台</button><button class="btn primary">＋ 新建录音</button></div></div></header><main class="wrap library"><div class="head"><div><h1>录音记录</h1><p>试听、转写和管理所有已保存录音</p></div><div class="stats"><div><strong>5</strong>条录音</div><div><strong>1:35:11</strong>累计时长</div></div></div><aside class="notice"><span><b>●　4 条录音等待处理</b>，源文件均已安全保存</span><button class="btn" id="pending">只看待处理</button></aside><section class="panel"><div class="toolbar"><input id="search" placeholder="搜索标题或文件名" aria-label="搜索录音"><select id="statusFilter"><option value="all">全部处理状态</option><option value="pending">待处理</option><option value="done">已生成笔记</option></select><select id="archiveFilter"><option value="all">全部归档状态</option><option value="yes">已归档</option><option value="no">未归档</option></select></div><div class="table-head"><span>录音</span><span>时长</span><span>处理状态</span><span>保存状态</span><span></span></div><div id="list"></div><footer class="foot"><span id="count"></span><span>点击播放进入完整播放器</span></footer></section></main></section>
<section class="view player" id="player"><header class="player-bar"><div class="wrap"><button class="back" id="back">←　返回录音记录</button><div class="actions"><button class="dark-btn" data-toast="修改标题（原型演示）">✎ 修改标题</button><button class="dark-btn" data-toast="更多操作（原型演示）">•••</button></div></div></header><main class="player-shell"><div class="player-title"><div class="kicker"><i class="live-dot"></i><span id="state"></span></div><h1 id="playerTitle"></h1><p id="playerMeta"></p></div><section class="wave-card"><div class="wave-wrap" id="waveWrap" tabindex="0" role="slider" aria-label="播放进度"><div class="wave" id="wave"></div><i class="playhead" id="playhead"></i></div><div class="time"><span id="current">00:00</span><span id="duration"></span></div><div class="controls"><div class="side-control"><button class="control" id="volume">音量 100%</button><button class="control" data-toast="已标记当前位置">＋ 标记重点</button></div><div class="transport"><button class="jump" id="back10">↶ 10</button><button class="main-play" id="play" aria-label="播放"><svg id="playIcon" width="25" height="25" viewBox="0 0 24 24" fill="currentColor"><path d="m8 5 11 7-11 7Z"/></svg></button><button class="jump" id="forward10">10 ↷</button></div><div class="side-control right"><div class="speed" id="speed"><button class="control" id="speedBtn">1×</button><div class="speed-pop"><button data-speed=".75">0.75×</button><button class="active" data-speed="1">1×</button><button data-speed="1.25">1.25×</button><button data-speed="1.5">1.5×</button><button data-speed="2">2×</button></div></div><button class="control" data-toast="下载录音（原型演示）">↓ 下载</button></div></div></section><section class="info-grid"><article class="info-card"><h2>录音信息</h2><div class="facts"><div class="fact"><span>录制时间</span><strong id="date"></strong></div><div class="fact"><span>录音时长</span><strong id="factDuration"></strong></div><div class="fact"><span>文件格式</span><strong id="format"></strong></div></div><div class="source"><div><strong>源文件已安全保存</strong><span id="path"></span></div><button class="dark-btn" data-toast="路径已复制">复制路径</button></div></article><aside class="info-card next-action"><h2>下一步</h2><p>试听确认声音完整后，可转写并生成结构化笔记。处理不会改变原始录音。</p><button class="convert" data-toast="已提交转写任务（原型演示）">转写并生成笔记</button></aside></section><nav class="nextbar"><button class="next" id="prev">← 上一条：<span></span></button><button class="next" id="next">下一条：<span></span> →</button></nav></main></section><div class="toast" id="toast"></div>
<script>
const data=[['2026年09月07日 13点58分','09/07 16:42',2325,'m4a','pending'],['2026年09月04日 15点01分','09/07 15:25',1864,'m4a','pending'],['录音笔记 2026-09-07 10-09','09/07 14:43',2147,'webm','pending'],['录音笔记 2026-09-05 15-45','09/05 15:46',32,'webm','pending'],['录音笔记 2026-09-09 09-14','09/09 10:12',3443,'webm','done']].map((x,i)=>({id:i+1,title:x[0],date:x[1],duration:x[2],format:x[3],status:x[4],file:`${x[0]}.${x[3]}`}));let selected=data[0],playing=false,progress=0,rate=1,timer;const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],fmt=s=>`${String(Math.floor(s/60)).padStart(2,'0')}:${String(Math.floor(s%60)).padStart(2,'0')}`;function toast(m){let t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),1700)}function render(){let q=$('#search').value.toLowerCase(),s=$('#statusFilter').value,a=$('#archiveFilter').value,r=data.filter(x=>(!q||(x.title+x.file).toLowerCase().includes(q))&&(s==='all'||x.status===s)&&(a!=='no'));$('#list').innerHTML=r.map(x=>`<article class="record"><div class="main"><span class="file-icon">♫</span><div><div class="title">${x.title}</div><div class="meta">${x.date} · ${x.file}</div></div></div><span class="cell">${fmt(x.duration)}</span><span class="status pill ${x.status==='done'?'done':''}">${x.status==='done'?'已生成笔记':'待处理'}</span><span class="archive cell">已归档</span><button class="row-play" data-id="${x.id}" aria-label="播放 ${x.title}">▶</button></article>`).join('')||'<div class="foot">没有符合条件的录音</div>';$('#count').textContent=`显示 ${r.length} 条录音`;$$('[data-id]').forEach(b=>b.onclick=()=>open(Number(b.dataset.id)))}function bars(){let w=$('#wave');w.innerHTML='';for(let i=0;i<108;i++){let b=document.createElement('i');b.style.height=`${15+(i*29+i%7*9)%140}px`;w.appendChild(b)}paint()}function paint(){let p=progress/selected.duration*100;$('#playhead').style.left=`${p}%`;$$('#wave i').forEach((b,i)=>b.classList.toggle('played',i/108*100<=p));$('#current').textContent=fmt(progress)}function setPlay(on){playing=on;$('#playIcon').innerHTML=on?'<path d="M7 5h4v14H7zM14 5h4v14h-4z"/>':'<path d="m8 5 11 7-11 7Z"/>';$('#play').setAttribute('aria-label',on?'暂停':'播放');clearInterval(timer);if(on)timer=setInterval(()=>{progress=Math.min(selected.duration,progress+.25*rate);paint();if(progress>=selected.duration)setPlay(false)},250)}function fill(){let i=data.indexOf(selected),p=data[(i+data.length-1)%data.length],n=data[(i+1)%data.length];$('#playerTitle').textContent=selected.title;$('#playerMeta').textContent=`${selected.date} · ${selected.file}`;$('#state').textContent=`源文件已保存 · ${selected.status==='done'?'已生成笔记':'待处理'}`;$('#duration').textContent=$('#factDuration').textContent=fmt(selected.duration);$('#date').textContent=selected.date;$('#format').textContent=selected.format.toUpperCase();$('#path').textContent=`D:\\data\\recordings\\${selected.file}`;$('#prev span').textContent=p.title;$('#next span').textContent=n.title;$('#prev').dataset.to=p.id;$('#next').dataset.to=n.id;progress=0;setPlay(false);bars()}function open(id){selected=data.find(x=>x.id===id);fill();$('#library').classList.remove('active');$('#player').classList.add('active');scrollTo(0,0);setTimeout(()=>setPlay(true),150)}function back(){setPlay(false);$('#player').classList.remove('active');$('#library').classList.add('active')}$('#back').onclick=back;$('#play').onclick=()=>setPlay(!playing);$('#back10').onclick=()=>{progress=Math.max(0,progress-10);paint()};$('#forward10').onclick=()=>{progress=Math.min(selected.duration,progress+10);paint()};$('#waveWrap').onclick=e=>{let r=e.currentTarget.getBoundingClientRect();progress=(e.clientX-r.left)/r.width*selected.duration;paint()};$('#speedBtn').onclick=()=>$('#speed').classList.toggle('open');$$('[data-speed]').forEach(b=>b.onclick=()=>{rate=+b.dataset.speed;$('#speedBtn').textContent=`${rate}×`;$$('[data-speed]').forEach(x=>x.classList.toggle('active',x===b));$('#speed').classList.remove('open')});$('#volume').onclick=()=>{$('#volume').textContent=$('#volume').textContent.includes('100')?'已静音':'音量 100%'};$('#prev').onclick=$('#next').onclick=e=>open(+e.currentTarget.dataset.to);$('#pending').onclick=()=>{$('#statusFilter').value='pending';render()};['#search','#statusFilter','#archiveFilter'].forEach(s=>$(s).addEventListener(s==='#search'?'input':'change',render));$$('[data-toast]').forEach(b=>b.onclick=()=>toast(b.dataset.toast));render();
</script></body></html>
