<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>录音记录 · 紧凑播放器原型</title>
  <style>
    :root{
      --bg:#f4f6f9;--panel:#fff;--ink:#172033;--muted:#68758a;--faint:#98a2b3;
      --line:#e4e8ef;--line-soft:#edf0f5;--blue:#2563eb;--blue-2:#1d4ed8;
      --blue-soft:#edf4ff;--green:#07815f;--green-soft:#eaf8f3;--amber:#9a5a00;
      --amber-soft:#fff6df;--shadow:0 12px 36px rgba(23,32,51,.06);
      font-family:Inter,"SF Pro Display","Segoe UI","Microsoft YaHei",sans-serif;
      color:var(--ink);background:var(--bg)
    }
    *{box-sizing:border-box}body{margin:0;min-width:320px;background:var(--bg)}button,input,select{font:inherit}button{cursor:pointer}
    button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid rgba(37,99,235,.2);outline-offset:2px}
    svg{display:block}.app{min-height:100vh}.topbar{height:58px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.92);backdrop-filter:blur(12px)}
    .topbar-inner,.shell{width:min(1500px,calc(100% - 40px));margin:auto}.topbar-inner{height:100%;display:flex;align-items:center;justify-content:space-between}
    .brand{display:flex;align-items:center;gap:11px;font-size:15px;font-weight:760}.brand-mark{width:31px;height:31px;display:grid;place-items:center;border-radius:9px;color:#fff;background:var(--blue)}
    .top-actions{display:flex;gap:8px}.btn{height:36px;padding:0 13px;display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);border-radius:8px;background:#fff;color:#344054;font-weight:600;font-size:13px;transition:.16s ease}
    .btn:hover{border-color:#cbd3df;background:#fafbfc}.btn.primary{border-color:var(--blue);background:var(--blue);color:#fff}.btn.primary:hover{border-color:var(--blue-2);background:var(--blue-2)}
    .icon-btn{width:36px;height:36px;padding:0;display:grid;place-items:center;border:1px solid transparent;border-radius:8px;background:transparent;color:var(--muted)}.icon-btn:hover{border-color:var(--line);background:#fff;color:var(--ink)}
    .shell{padding:24px 0 32px}.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:18px}.page-head h1{margin:0;font-size:26px;letter-spacing:-.035em}.page-head p{margin:6px 0 0;color:var(--muted);font-size:13px}.head-stat{display:flex;align-items:center;gap:9px;color:var(--muted);font-size:13px}.head-stat strong{color:var(--ink);font-size:18px}
    .notice{min-height:48px;margin-bottom:12px;padding:9px 13px;display:flex;align-items:center;justify-content:space-between;gap:16px;border:1px solid #f0d58c;border-radius:10px;background:#fff9e8}.notice-copy{display:flex;align-items:center;gap:10px;color:#7a4b00;font-size:13px}.notice-dot{width:8px;height:8px;border-radius:50%;background:#e69b12;box-shadow:0 0 0 4px rgba(230,155,18,.12)}
    .workspace{display:grid;grid-template-columns:minmax(560px,1.44fr) minmax(370px,.86fr);gap:14px;align-items:start}.panel{border:1px solid var(--line);border-radius:12px;background:var(--panel);box-shadow:var(--shadow);overflow:hidden}
    .toolbar{min-height:62px;padding:12px;display:grid;grid-template-columns:minmax(220px,1fr) 154px 136px;gap:8px;border-bottom:1px solid var(--line)}.search{position:relative}.search svg{position:absolute;left:12px;top:11px;color:var(--faint)}
    .search input,.select{width:100%;height:38px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);font-size:13px}.search input{padding:0 12px 0 37px}.search input::placeholder{color:var(--faint)}.select{padding:0 10px}
    .list-head{height:34px;padding:0 14px;display:grid;grid-template-columns:minmax(0,1fr) 88px 92px 32px;gap:10px;align-items:center;border-bottom:1px solid var(--line-soft);background:#fafbfc;color:var(--faint);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
    .record{position:relative;width:100%;min-height:78px;padding:13px 14px;display:grid;grid-template-columns:minmax(0,1fr) 88px 92px 32px;gap:10px;align-items:center;border:0;border-bottom:1px solid var(--line-soft);background:#fff;text-align:left;color:inherit;transition:.15s ease}.record:last-child{border-bottom:0}.record:hover{background:#fafcff}.record.selected{background:#f4f8ff}.record.selected:before{content:"";position:absolute;inset:9px auto 9px 0;width:3px;border-radius:0 3px 3px 0;background:var(--blue)}
    .record-main{min-width:0;display:grid;grid-template-columns:38px minmax(0,1fr);gap:11px;align-items:center}.file-icon{width:38px;height:38px;display:grid;place-items:center;border-radius:9px;color:var(--blue);background:var(--blue-soft)}.record-title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px;font-weight:750}.record-meta{margin-top:5px;display:flex;align-items:center;gap:7px;overflow:hidden;color:var(--muted);font-size:12px;white-space:nowrap}.record-meta .file{overflow:hidden;text-overflow:ellipsis}.duration{color:#475467;font-size:12px;font-variant-numeric:tabular-nums}.pill{width:max-content;min-height:23px;padding:0 8px;display:inline-flex;align-items:center;border-radius:999px;font-size:11px;font-weight:700}.pill.pending{color:var(--amber);background:var(--amber-soft)}.pill.done{color:var(--green);background:var(--green-soft)}.row-play{width:32px;height:32px;display:grid;place-items:center;border:1px solid var(--line);border-radius:50%;background:#fff;color:var(--blue)}.row-play:hover{border-color:#b8c8ea;background:var(--blue-soft)}.record.selected .row-play{border-color:var(--blue);background:var(--blue);color:#fff}
    .list-foot{min-height:44px;padding:0 14px;display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--line);color:var(--muted);font-size:12px}.density{display:flex;align-items:center;gap:6px}.density button{height:26px;padding:0 8px;border:0;border-radius:6px;background:transparent;color:var(--muted);font-size:11px}.density button.active{background:#eef2f7;color:var(--ink);font-weight:700}
    .detail{position:sticky;top:16px}.detail-head{padding:17px 18px 15px;display:flex;align-items:flex-start;justify-content:space-between;gap:14px;border-bottom:1px solid var(--line-soft)}.eyebrow{display:block;margin-bottom:7px;color:var(--blue);font-size:11px;font-weight:800;letter-spacing:.08em}.detail-title{margin:0;font-size:19px;line-height:1.35;letter-spacing:-.025em}.detail-meta{margin-top:6px;color:var(--muted);font-size:12px}.detail-body{padding:16px 18px 18px}
    .player{padding:14px;border:1px solid #dbe4f2;border-radius:11px;background:linear-gradient(180deg,#fbfdff,#f5f8fc)}.wave-wrap{position:relative;height:66px;display:flex;align-items:center;cursor:pointer;touch-action:none}.wave{position:absolute;inset:0;display:flex;align-items:center;gap:2px;overflow:hidden}.wave i{flex:1;min-width:2px;border-radius:10px;background:#cfd8e7;transition:background .1s}.wave i.played{background:var(--blue)}.playhead{position:absolute;top:4px;bottom:4px;left:0;width:2px;border-radius:2px;background:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.12);pointer-events:none}.time-row{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}
    .player-controls{margin-top:12px;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px}.transport{display:flex;align-items:center;gap:5px}.transport button{border:0;background:transparent;color:#46556c}.transport .main-play{width:42px;height:42px;display:grid;place-items:center;border-radius:50%;background:var(--blue);color:#fff;box-shadow:0 7px 16px rgba(37,99,235,.23)}.transport .main-play:hover{background:var(--blue-2)}.jump{width:32px;height:32px;display:grid;place-items:center;border-radius:7px!important}.jump:hover{background:#eaf0f8}.now-playing{min-width:0}.now-playing strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}.now-playing span{display:block;margin-top:3px;color:var(--muted);font-size:11px}.player-options{display:flex;align-items:center;gap:4px}.option{height:32px;padding:0 8px;border:1px solid transparent;border-radius:7px;background:transparent;color:#526078;font-size:12px;font-weight:700}.option:hover{border-color:var(--line);background:#fff}.speed-menu{position:relative}.speed-pop{position:absolute;right:0;bottom:38px;z-index:5;width:92px;padding:5px;display:none;border:1px solid var(--line);border-radius:9px;background:#fff;box-shadow:0 12px 28px rgba(23,32,51,.16)}.speed-menu.open .speed-pop{display:grid}.speed-pop button{height:30px;border:0;border-radius:6px;background:transparent;color:var(--muted);font-size:12px;text-align:left}.speed-pop button:hover,.speed-pop button.active{background:var(--blue-soft);color:var(--blue);font-weight:700}
    .status-row{margin-top:14px;display:flex;align-items:center;justify-content:space-between;gap:10px}.status-row>div{display:flex;gap:6px}.storage{margin-top:14px;padding:11px 12px;display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:9px;align-items:center;border-radius:9px;background:#f7f9fc}.storage-icon{width:28px;height:28px;display:grid;place-items:center;border-radius:7px;background:#e8edf5;color:#526078}.storage strong{display:block;font-size:12px}.storage span{display:block;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);font-size:11px}.copy{border:0;background:transparent;color:var(--blue);font-size:11px;font-weight:700}
    .primary-action{width:100%;height:44px;margin-top:14px;border:0;border-radius:9px;background:var(--blue);color:#fff;font-weight:750}.primary-action:hover{background:var(--blue-2)}.secondary-actions{margin-top:8px;display:grid;grid-template-columns:1fr 1fr;gap:8px}.secondary-actions .btn{width:100%}
    .tip{margin-top:13px;padding-top:13px;border-top:1px solid var(--line-soft);color:var(--muted);font-size:11px;line-height:1.5}.toast{position:fixed;left:50%;bottom:24px;z-index:10;max-width:calc(100% - 30px);padding:10px 14px;transform:translate(-50%,18px);border-radius:8px;background:#172033;color:#fff;font-size:12px;opacity:0;pointer-events:none;transition:.2s ease}.toast.show{opacity:1;transform:translate(-50%,0)}
    @media(max-width:980px){.workspace{grid-template-columns:1fr}.detail{position:static}.detail .panel{box-shadow:var(--shadow)}.list-head,.record{grid-template-columns:minmax(0,1fr) 74px 84px 32px}}
    @media(max-width:660px){.topbar-inner,.shell{width:min(100% - 24px,1500px)}.top-actions .btn:first-child{display:none}.shell{padding-top:18px}.page-head{align-items:flex-start}.head-stat{display:none}.notice{align-items:flex-start}.notice>.btn{display:none}.workspace{display:flex;flex-direction:column}.workspace>.panel{width:100%}.toolbar{grid-template-columns:1fr 1fr}.search{grid-column:1/-1}.list-head{display:none}.record{grid-template-columns:minmax(0,1fr) 74px 32px;min-height:72px;padding:11px 12px}.record .pill{display:none}.record-main{grid-template-columns:34px minmax(0,1fr)}.file-icon{width:34px;height:34px}.detail-body,.detail-head{padding-left:14px;padding-right:14px}.player-controls{grid-template-columns:auto 1fr}.player-options{grid-column:1/-1;justify-content:flex-end}.secondary-actions{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar"><div class="topbar-inner"><div class="brand"><span class="brand-mark" aria-hidden="true"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v3M8 22h8"/></svg></span>录音记录</div><div class="top-actions"><button class="btn" data-toast="返回工作台（原型演示）">返回工作台</button><button class="btn primary" data-toast="开始新录音（原型演示）"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>新建录音</button></div></div></header>
    <main class="shell">
      <section class="page-head"><div><h1>录音记录</h1><p>集中试听、转写和管理所有已保存录音</p></div><div class="head-stat"><span>共 <strong>5</strong> 条</span><span>·</span><span>累计 1小时35分</span></div></section>
      <aside class="notice"><div class="notice-copy"><span class="notice-dot"></span><span><strong>4 条录音等待处理</strong>，源文件均已安全保存</span></div><button class="btn" id="pendingFilter">只看待处理</button></aside>
      <div class="workspace">
        <section class="panel" aria-label="录音列表">
          <div class="toolbar"><label class="search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="search" type="search" placeholder="搜索标题或文件名" aria-label="搜索录音" /></label><select class="select" id="processFilter" aria-label="处理状态"><option value="all">全部处理状态</option><option value="pending">待处理</option><option value="done">已生成笔记</option></select><select class="select" id="archiveFilter" aria-label="归档状态"><option value="all">全部归档状态</option><option value="archived">已归档</option><option value="active">未归档</option></select></div>
          <div class="list-head"><span>录音</span><span>时长</span><span>处理状态</span><span></span></div>
          <div id="recordList"></div>
          <footer class="list-foot"><span id="resultCount">显示 5 条录音</span><div class="density"><span>密度</span><button class="active" type="button">紧凑</button><button type="button" data-toast="舒适密度仅作状态演示">舒适</button></div></footer>
        </section>
        <aside class="detail" aria-label="录音详情"><section class="panel">
          <header class="detail-head"><div><span class="eyebrow">录音详情</span><h2 class="detail-title" id="detailTitle"></h2><div class="detail-meta" id="detailMeta"></div></div><button class="icon-btn" aria-label="编辑标题" data-toast="编辑标题（原型演示）"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button></header>
          <div class="detail-body">
            <section class="player" aria-label="音频播放器">
              <div class="wave-wrap" id="waveWrap" aria-label="拖动音频进度" role="slider" tabindex="0" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="wave" id="wave"></div><span class="playhead" id="playhead"></span></div>
              <div class="time-row"><span id="currentTime">00:00</span><span id="durationTime">00:00</span></div>
              <div class="player-controls"><div class="transport"><button class="jump" id="backBtn" aria-label="后退10秒"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M9 10v4M13 10h2v4h-2"/></svg></button><button class="main-play" id="mainPlay" aria-label="播放"><svg id="playIcon" width="19" height="19" viewBox="0 0 24 24" fill="currentColor"><path d="m8 5 11 7-11 7Z"/></svg></button><button class="jump" id="forwardBtn" aria-label="前进10秒"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/><path d="M9 10v4M13 10h2v4h-2"/></svg></button></div><div class="now-playing"><strong id="nowPlaying"></strong><span id="playState">准备播放</span></div><div class="player-options"><button class="option" id="volumeBtn" aria-label="静音"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5 6 9H2v6h4l5 4Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18 5a9 9 0 0 1 0 14"/></svg></button><div class="speed-menu" id="speedMenu"><button class="option" id="speedBtn">1×</button><div class="speed-pop"> <button data-speed="0.75">0.75×</button><button class="active" data-speed="1">1×</button><button data-speed="1.25">1.25×</button><button data-speed="1.5">1.5×</button><button data-speed="2">2×</button></div></div><button class="option" data-toast="更多播放设置（原型演示）">•••</button></div></div>
            </section>
            <div class="status-row"><div><span class="pill pending" id="detailStatus">待处理</span><span class="pill done">已归档</span></div><button class="copy" data-toast="文件信息已复制">复制信息</button></div>
            <div class="storage"><span class="storage-icon"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18v12H3z"/><path d="M7 10h10"/></svg></span><div><strong>源文件已安全保存</strong><span id="filePath"></span></div><button class="copy" data-toast="路径已复制">复制路径</button></div>
            <button class="primary-action" data-toast="已提交转写任务（原型演示）">转写并生成笔记</button>
            <div class="secondary-actions"><button class="btn" data-toast="开始下载录音（原型演示）"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0 4-4m-4 4-4-4M4 20h16"/></svg>下载录音</button><button class="btn" data-toast="归档状态已切换（原型演示）">取消归档</button></div>
            <p class="tip">播放不会触发上传。只有点击“转写并生成笔记”后，录音才会进入处理流程。</p>
          </div>
        </section></aside>
      </div>
    </main>
  </div><div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script>
    const records=[
      {id:1,title:'2026年09月07日 13点58分',date:'09/07 16:42',duration:2325,file:'2026年09月07日 13点58分.m4a',status:'pending',archived:true},
      {id:2,title:'2026年09月04日 15点01分',date:'09/07 15:25',duration:1864,file:'2026年09月04日 15点01分.m4a',status:'pending',archived:true},
      {id:3,title:'录音笔记 2026-09-07 10-09',date:'09/07 14:43',duration:2147,file:'录音笔记 2026-09-07 10-09.webm',status:'pending',archived:true},
      {id:4,title:'录音笔记 2026-09-05 15-45',date:'09/05 15:46',duration:32,file:'录音笔记 2026-09-05 15-45.webm',status:'pending',archived:true},
      {id:5,title:'录音笔记 2026-09-09 09-14',date:'09/09 10:12',duration:3443,file:'录音笔记 2026-09-09 09-14.webm',status:'done',archived:true}
    ];
    let selected=records[0],playing=false,progress=0,speed=1,muted=false,timer=null;
    const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
    const fmt=s=>`${String(Math.floor(s/60)).padStart(2,'0')}:${String(Math.floor(s%60)).padStart(2,'0')}`;
    const icon=`<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l10-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="16" cy="16" r="3"/></svg>`;
    const play=`<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="m8 5 11 7-11 7Z"/></svg>`;
    function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),1800)}
    function filtered(){const q=$('#search').value.trim().toLowerCase(),p=$('#processFilter').value,a=$('#archiveFilter').value;return records.filter(r=>(!q||`${r.title} ${r.file}`.toLowerCase().includes(q))&&(p==='all'||r.status===p)&&(a==='all'||(a==='archived')===r.archived))}
    function renderList(){const items=filtered();$('#recordList').innerHTML=items.length?items.map(r=>`<button class="record ${r.id===selected.id?'selected':''}" data-id="${r.id}"><span class="record-main"><span class="file-icon">${icon}</span><span><span class="record-title">${r.title}</span><span class="record-meta"><span>${r.date}</span><span>·</span><span class="file">${r.file}</span></span></span></span><span class="duration">${fmt(r.duration)}</span><span class="pill ${r.status==='done'?'done':'pending'}">${r.status==='done'?'已生成笔记':'待处理'}</span><span class="row-play" aria-label="打开并播放">${play}</span></button>`).join(''):`<div style="padding:52px 20px;text-align:center;color:var(--muted);font-size:13px">没有符合条件的录音</div>`;$('#resultCount').textContent=`显示 ${items.length} 条录音`;$$('.record').forEach(b=>b.onclick=()=>selectRecord(Number(b.dataset.id),true))}
    function buildWave(){const wave=$('#wave');wave.innerHTML='';for(let i=0;i<72;i++){const bar=document.createElement('i');bar.style.height=`${10+((i*17+i%5*7)%44)}px`;wave.appendChild(bar)}paintWave()}
    function paintWave(){const pct=progress/selected.duration*100;$('#playhead').style.left=`calc(${pct}% - 1px)`;$$('#wave i').forEach((b,i)=>b.classList.toggle('played',i/72*100<=pct));$('#currentTime').textContent=fmt(progress);$('#waveWrap').setAttribute('aria-valuenow',String(Math.round(pct)))}
    function selectRecord(id,autoplay=false){selected=records.find(r=>r.id===id);playing=false;clearInterval(timer);progress=0;$('#detailTitle').textContent=selected.title;$('#detailMeta').textContent=`${selected.date} · ${fmt(selected.duration)} · ${selected.file}`;$('#nowPlaying').textContent=selected.title;$('#durationTime').textContent=fmt(selected.duration);$('#filePath').textContent=`D:\\data\\recordings\\${selected.file}`;$('#detailStatus').textContent=selected.status==='done'?'已生成笔记':'待处理';$('#detailStatus').className=`pill ${selected.status==='done'?'done':'pending'}`;setPlay(false);buildWave();renderList();if(autoplay)setPlay(true)}
    function setPlay(on){playing=on;$('#playIcon').innerHTML=on?'<path d="M7 5h4v14H7zM14 5h4v14h-4z"/>':'<path d="m8 5 11 7-11 7Z"/>';$('#mainPlay').setAttribute('aria-label',on?'暂停':'播放');$('#playState').textContent=on?`${speed}× 播放中`:'准备播放';clearInterval(timer);if(on)timer=setInterval(()=>{progress=Math.min(selected.duration,progress+.25*speed);paintWave();if(progress>=selected.duration)setPlay(false)},250)}
    function seek(delta){progress=Math.max(0,Math.min(selected.duration,progress+delta));paintWave()}
    function seekFromEvent(e){const rect=$('#waveWrap').getBoundingClientRect();progress=Math.max(0,Math.min(selected.duration,(e.clientX-rect.left)/rect.width*selected.duration));paintWave()}
    $('#mainPlay').onclick=()=>setPlay(!playing);$('#backBtn').onclick=()=>seek(-10);$('#forwardBtn').onclick=()=>seek(10);$('#waveWrap').onclick=seekFromEvent;$('#waveWrap').onkeydown=e=>{if(e.key==='ArrowLeft')seek(-5);if(e.key==='ArrowRight')seek(5);if(e.key===' '){e.preventDefault();setPlay(!playing)}};
    $('#speedBtn').onclick=()=>$('#speedMenu').classList.toggle('open');$$('[data-speed]').forEach(b=>b.onclick=()=>{speed=Number(b.dataset.speed);$('#speedBtn').textContent=`${speed}×`;$$('[data-speed]').forEach(x=>x.classList.toggle('active',x===b));$('#speedMenu').classList.remove('open');if(playing)$('#playState').textContent=`${speed}× 播放中`});
    $('#volumeBtn').onclick=()=>{muted=!muted;$('#volumeBtn').style.color=muted?'#c2413a':'';toast(muted?'已静音':'已恢复声音')};
    ['#search','#processFilter','#archiveFilter'].forEach(s=>$(s).addEventListener(s==='#search'?'input':'change',renderList));$('#pendingFilter').onclick=()=>{$('#processFilter').value='pending';renderList();toast('已筛选待处理录音')};$$('[data-toast]').forEach(b=>b.onclick=()=>toast(b.dataset.toast));
    selectRecord(1);
  </script>
</body>
</html>
