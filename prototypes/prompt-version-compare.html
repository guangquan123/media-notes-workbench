<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>提示词版本对比 · 原型</title>
  <style>
    :root {
      --bg: #f4f6f8;
      --surface: #ffffff;
      --surface-muted: #f8fafc;
      --line: #e5e7eb;
      --line-strong: #d0d5dd;
      --text: #17202d;
      --text-muted: #667085;
      --text-subtle: #98a2b3;
      --blue: #2563eb;
      --blue-soft: #eff6ff;
      --blue-line: #bfd5ff;
      --green: #027a48;
      --green-soft: #ecfdf3;
      --red: #be123c;
      --red-soft: #fff1f2;
      --orange: #c2410c;
      --orange-soft: #fff7ed;
      --shadow: 0 16px 38px rgba(16, 24, 40, .08);
      --small-shadow: 0 5px 18px rgba(16, 24, 40, .06);
      --radius-lg: 16px;
      --radius-md: 11px;
      --radius-sm: 8px;
    }

    * { box-sizing: border-box; }
    html { color-scheme: light; background: var(--bg); }
    body { margin: 0; color: var(--text); background: var(--bg); font: 14px/1.55 Inter, "Microsoft YaHei", "PingFang SC", sans-serif; }
    button, select, input { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, select:focus-visible, input:focus-visible { outline: 3px solid rgba(37, 99, 235, .2); outline-offset: 2px; }

    .app-shell { min-height: 100vh; display: grid; grid-template-rows: 70px 1fr; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 24px; padding: 0 44px; background: rgba(255,255,255,.92); border-bottom: 1px solid var(--line); }
    .brand { display: flex; align-items: center; gap: 12px; min-width: 210px; }
    .brand-mark { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; color: #fff; background: #111827; font-weight: 800; letter-spacing: -.05em; }
    .brand-title { font-size: 14px; font-weight: 750; }
    .brand-subtitle { color: var(--text-subtle); font-size: 11px; margin-top: 1px; }
    .breadcrumb { display: flex; align-items: center; gap: 9px; flex: 1; color: var(--text-muted); font-size: 12px; }
    .breadcrumb strong { color: var(--text); font-weight: 700; }
    .top-actions { display: flex; align-items: center; gap: 10px; }
    .icon-btn, .ghost-btn, .primary-btn { border: 1px solid transparent; border-radius: var(--radius-sm); min-height: 36px; padding: 0 13px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: .18s ease; }
    .icon-btn { width: 36px; padding: 0; color: var(--text-muted); background: transparent; font-size: 19px; }
    .icon-btn:hover, .ghost-btn:hover { background: var(--surface-muted); color: var(--text); }
    .ghost-btn { color: var(--text-muted); background: var(--surface); border-color: var(--line-strong); }
    .primary-btn { color: #fff; background: var(--blue); box-shadow: 0 4px 10px rgba(37, 99, 235, .18); font-weight: 700; }
    .primary-btn:hover { background: #1d4ed8; transform: translateY(-1px); }

    .workspace { display: grid; grid-template-columns: 216px minmax(0, 1fr); min-height: 0; }
    .sidebar { padding: 30px 18px; border-right: 1px solid var(--line); background: #f8fafc; }
    .sidebar-label { padding: 0 12px 10px; color: var(--text-subtle); font-size: 11px; font-weight: 700; letter-spacing: .04em; }
    .side-item { width: 100%; display: flex; align-items: flex-start; gap: 10px; padding: 12px; border: 1px solid transparent; border-radius: 11px; text-align: left; background: transparent; color: var(--text-muted); margin-bottom: 6px; }
    .side-item:hover { background: #fff; border-color: var(--line); color: var(--text); }
    .side-item.active { background: #111827; color: #fff; box-shadow: var(--small-shadow); }
    .side-icon { width: 19px; color: currentColor; font-size: 16px; line-height: 1; text-align: center; }
    .side-title { font-size: 12px; font-weight: 700; }
    .side-desc { margin-top: 2px; font-size: 10px; line-height: 1.35; opacity: .68; }

    main { min-width: 0; padding: 32px 40px 48px; overflow: auto; }
    .page-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 24px; max-width: 1440px; margin: 0 auto 26px; }
    .eyebrow { color: var(--blue); font-size: 11px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 7px 0 6px; font-size: clamp(24px, 2.5vw, 34px); letter-spacing: -.025em; line-height: 1.16; }
    .page-subtitle { margin: 0; max-width: 650px; color: var(--text-muted); font-size: 13px; }
    .head-note { display: flex; align-items: center; gap: 8px; color: var(--text-muted); font-size: 12px; padding-top: 26px; white-space: nowrap; }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; background: #12b76a; }

    .content-grid { max-width: 1440px; margin: 0 auto; display: grid; gap: 18px; }
    .selection-bar { display: grid; grid-template-columns: 1fr 48px 1fr auto; gap: 12px; align-items: end; padding: 18px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); box-shadow: var(--small-shadow); }
    .field-label { display: block; color: var(--text-muted); font-size: 11px; font-weight: 750; margin: 0 0 7px; }
    .select-wrap { position: relative; }
    select { width: 100%; min-height: 50px; padding: 0 38px 0 14px; border: 1px solid var(--line-strong); border-radius: var(--radius-md); color: var(--text); background: #fff; appearance: none; font-weight: 700; }
    select:hover { border-color: #98a2b3; }
    .select-arrow { position: absolute; right: 14px; top: 15px; color: var(--text-muted); pointer-events: none; font-size: 16px; }
    .version-meta { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 2px 0; color: var(--text-subtle); font-size: 10px; }
    .pill { display: inline-flex; align-items: center; border-radius: 999px; padding: 3px 8px; font-size: 10px; font-weight: 750; }
    .pill.published { background: var(--green-soft); color: var(--green); }
    .pill.draft { background: #f2f4f7; color: var(--text-muted); }
    .swap-btn { width: 42px; height: 42px; margin-bottom: 8px; border: 1px solid var(--line-strong); border-radius: 10px; background: #fff; color: var(--text-muted); font-size: 20px; }
    .swap-btn:hover { border-color: var(--blue); color: var(--blue); background: var(--blue-soft); }
    .select-actions { display: flex; gap: 8px; align-items: end; padding-bottom: 1px; }

    .summary-row { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 16px; }
    .summary-card { display: flex; align-items: center; gap: 16px; min-height: 68px; padding: 14px 18px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); }
    .summary-title { font-weight: 800; font-size: 13px; }
    .summary-copy { margin-top: 2px; color: var(--text-muted); font-size: 11px; }
    .summary-stats { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .stat { min-width: 78px; text-align: center; padding: 7px 11px; border-radius: 9px; font-size: 11px; font-weight: 750; }
    .stat strong { display: block; font-size: 15px; line-height: 1.05; }
    .stat.add { background: var(--green-soft); color: var(--green); }
    .stat.remove { background: var(--red-soft); color: var(--red); }
    .stat.change { background: var(--orange-soft); color: var(--orange); }
    .similarity { color: var(--text-muted); font-size: 11px; white-space: nowrap; }

    .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); }
    .filter-group { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
    .toolbar-label { color: var(--text-muted); font-size: 11px; font-weight: 750; margin-right: 5px; }
    .filter-btn { padding: 7px 12px; border: 1px solid var(--line-strong); border-radius: 999px; background: #fff; color: var(--text-muted); font-size: 11px; font-weight: 700; }
    .filter-btn:hover { color: var(--text); border-color: #98a2b3; }
    .filter-btn.active { border-color: #111827; background: #111827; color: #fff; }
    .toolbar-right { display: flex; align-items: center; gap: 12px; color: var(--text-muted); font-size: 11px; }
    .toggle { display: inline-flex; align-items: center; gap: 7px; cursor: pointer; }
    .toggle input { position: absolute; opacity: 0; pointer-events: none; }
    .toggle-track { width: 30px; height: 18px; padding: 2px; border-radius: 999px; background: #d0d5dd; transition: .18s ease; }
    .toggle-thumb { display: block; width: 14px; height: 14px; border-radius: 50%; background: #fff; transition: .18s ease; box-shadow: 0 1px 2px rgba(0,0,0,.15); }
    .toggle input:checked + .toggle-track { background: var(--blue); }
    .toggle input:checked + .toggle-track .toggle-thumb { transform: translateX(12px); }

    .diff-layout { display: grid; grid-template-columns: minmax(0, 1fr) 294px; gap: 18px; align-items: start; }
    .compare-card { min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); box-shadow: var(--shadow); overflow: hidden; }
    .compare-head { display: grid; grid-template-columns: 1fr 1fr; border-bottom: 1px solid var(--line); }
    .pane-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 16px 18px; background: var(--surface-muted); }
    .pane-head.new { background: var(--blue-soft); }
    .pane-label { font-size: 12px; font-weight: 800; }
    .pane-label.new { color: #1d4ed8; }
    .pane-meta { color: var(--text-subtle); font-size: 10px; }
    .compare-body { display: grid; grid-template-columns: 1fr 1fr; }
    .pane { min-width: 0; padding: 14px 0 28px; }
    .pane + .pane { border-left: 1px solid var(--line); }
    .diff-row { position: relative; display: grid; grid-template-columns: 38px minmax(0, 1fr); gap: 8px; padding: 8px 18px 8px 0; border-left: 3px solid transparent; min-height: 44px; }
    .diff-row.hidden { display: none; }
    .line-no { padding-top: 1px; color: #b6beca; font: 10px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; text-align: right; }
    .line-text { color: #475467; font: 12px/1.7 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap; overflow-wrap: anywhere; }
    .diff-row.context:hover { background: #f9fafb; }
    .diff-row.removed { background: var(--red-soft); border-left-color: #fb7185; }
    .diff-row.added { background: var(--green-soft); border-left-color: #34d399; }
    .diff-row.changed { background: var(--orange-soft); border-left-color: #fb923c; }
    .diff-row .change-tag { position: absolute; right: 11px; top: 7px; padding: 2px 5px; border-radius: 4px; font: 700 9px/1.2 Inter, sans-serif; }
    .removed .change-tag { color: var(--red); background: #ffe4e8; }
    .added .change-tag { color: var(--green); background: #d1fadf; }
    .changed .change-tag { color: var(--orange); background: #ffedd5; }
    .section-divider { margin: 12px 18px 3px; padding-top: 10px; border-top: 1px dashed var(--line-strong); color: var(--text-muted); font-size: 11px; font-weight: 800; }
    .empty-state { padding: 60px 30px; text-align: center; color: var(--text-muted); }
    .empty-state strong { display: block; margin-bottom: 7px; color: var(--text); }

    .side-panel { display: grid; gap: 14px; }
    .panel { padding: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); }
    .panel-title { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 13px; font-size: 12px; font-weight: 800; }
    .panel-link { border: 0; background: transparent; color: var(--blue); font-size: 11px; padding: 0; }
    .change-list { display: grid; gap: 7px; }
    .change-item { width: 100%; padding: 10px; border: 1px solid var(--line); border-radius: 9px; background: #fff; text-align: left; }
    .change-item:hover { border-color: var(--blue-line); background: var(--blue-soft); }
    .change-item-title { display: flex; align-items: center; gap: 6px; color: var(--text); font-size: 11px; font-weight: 750; }
    .change-item-copy { margin-top: 4px; color: var(--text-muted); font-size: 10px; line-height: 1.45; }
    .change-marker { width: 7px; height: 7px; border-radius: 50%; flex: 0 0 auto; }
    .change-marker.add { background: #34d399; }.change-marker.remove { background: #fb7185; }.change-marker.change { background: #fb923c; }
    .meta-list { display: grid; gap: 10px; }
    .meta-row { display: flex; justify-content: space-between; gap: 12px; color: var(--text-muted); font-size: 11px; }
    .meta-row strong { color: var(--text); font-weight: 700; text-align: right; }
    .panel-callout { padding: 11px 12px; border-radius: 9px; background: #f8fafc; color: var(--text-muted); font-size: 10px; line-height: 1.5; }
    .panel-callout b { color: var(--text); }

    .toast { position: fixed; right: 26px; bottom: 24px; z-index: 5; max-width: 360px; padding: 12px 15px; border: 1px solid #b7ebd0; border-radius: 10px; background: #f0fdf4; color: #166534; box-shadow: var(--shadow); font-size: 12px; opacity: 0; transform: translateY(10px); pointer-events: none; transition: .2s ease; }
    .toast.show { opacity: 1; transform: translateY(0); }

    @media (max-width: 1160px) {
      .workspace { grid-template-columns: 184px minmax(0, 1fr); }
      main { padding: 26px 24px 40px; }
      .diff-layout { grid-template-columns: 1fr; }
      .side-panel { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 820px) {
      .app-shell { display: block; }
      .topbar { padding: 14px 18px; min-height: 70px; flex-wrap: wrap; gap: 8px 16px; }
      .breadcrumb { order: 3; flex-basis: 100%; }
      .top-actions { margin-left: auto; }
      .workspace { display: block; }
      .sidebar { display: none; }
      main { padding: 22px 14px 30px; }
      .page-head { display: block; margin-bottom: 19px; }
      .head-note { padding-top: 11px; }
      .selection-bar { grid-template-columns: 1fr 42px 1fr; }
      .select-actions { grid-column: 1 / -1; justify-content: flex-end; padding-top: 2px; }
      .summary-row { grid-template-columns: 1fr; }
      .summary-card { display: block; }
      .summary-stats { margin-top: 12px; }
      .toolbar { align-items: flex-start; flex-direction: column; }
      .toolbar-right { width: 100%; justify-content: space-between; }
      .compare-card { overflow-x: auto; }
      .compare-head, .compare-body { min-width: 700px; }
      .side-panel { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">AI</div>
        <div><div class="brand-title">参数配置</div><div class="brand-subtitle">提示词模板工作区</div></div>
      </div>
      <div class="breadcrumb"><span>配置</span><span>/</span><strong>提示词模板</strong><span>/</span><strong>版本对比</strong></div>
      <div class="top-actions"><button class="ghost-btn" id="backBtn">← 返回提示词</button><button class="icon-btn" id="helpBtn" title="查看说明">?</button></div>
    </header>

    <div class="workspace">
      <aside class="sidebar" aria-label="配置模块">
        <div class="sidebar-label">配置模块</div>
        <button class="side-item"><span class="side-icon">✓</span><span><span class="side-title">开始使用</span><span class="side-desc">自动检测环境并给出下一步</span></span></button>
        <button class="side-item"><span class="side-icon">⌘</span><span><span class="side-title">连接器</span><span class="side-desc">选择飞书或钉钉协作能力</span></span></button>
        <button class="side-item active"><span class="side-icon">▣</span><span><span class="side-title">提示词模板</span><span class="side-desc">编辑、发布并对比生成提示词</span></span></button>
        <button class="side-item"><span class="side-icon">▤</span><span><span class="side-title">模型服务与转录</span><span class="side-desc">配置 API 提供者与转录方式</span></span></button>
      </aside>

      <main>
        <div class="page-head">
          <div>
            <div class="eyebrow">Prompt center / Compare</div>
            <h1>比较提示词版本</h1>
            <p class="page-subtitle">在独立工作区内查看任意两个版本的变化。左右两栏保持同一阅读节奏，新增、删除和修改一眼可见。</p>
          </div>
          <div class="head-note"><span class="status-dot"></span><span id="contextNote">学习笔记 · 当前比较 V2 → V3</span></div>
        </div>

        <div class="content-grid">
          <section class="selection-bar" aria-label="版本选择">
            <div>
              <label class="field-label" for="versionA">比较对象 A · 基准版本</label>
              <div class="select-wrap"><select id="versionA"></select><span class="select-arrow">⌄</span></div>
              <div class="version-meta"><span id="metaA"></span><span id="statusA" class="pill published"></span></div>
            </div>
            <button class="swap-btn" id="swapBtn" title="交换两个版本">⇄</button>
            <div>
              <label class="field-label" for="versionB">比较对象 B · 目标版本</label>
              <div class="select-wrap"><select id="versionB"></select><span class="select-arrow">⌄</span></div>
              <div class="version-meta"><span id="metaB"></span><span id="statusB" class="pill published"></span></div>
            </div>
            <div class="select-actions"><button class="ghost-btn" id="detailsBtn">版本详情</button><button class="primary-btn" id="newCompareBtn">＋ 新建比较</button></div>
          </section>

          <section class="summary-row">
            <div class="summary-card"><div><div class="summary-title" id="summaryTitle"></div><div class="summary-copy" id="summaryCopy"></div></div><div class="summary-stats"><div class="stat add"><strong id="addCount">0</strong>新增</div><div class="stat remove"><strong id="removeCount">0</strong>删除</div><div class="stat change"><strong id="changeCount">0</strong>修改</div></div><div class="similarity" id="similarity"></div></div>
          </section>

          <section class="toolbar" aria-label="差异筛选">
            <div class="filter-group"><span class="toolbar-label">显示</span><button class="filter-btn active" data-filter="all">全部差异</button><button class="filter-btn" data-filter="added">新增</button><button class="filter-btn" data-filter="removed">删除</button><button class="filter-btn" data-filter="changed">修改</button></div>
            <div class="toolbar-right"><label class="toggle"><input id="changedOnly" type="checkbox" checked /><span class="toggle-track"><span class="toggle-thumb"></span></span>仅显示改动</label><span id="visibleCount">显示 6 处</span><button class="icon-btn" id="collapseBtn" title="收起或展开全部差异">−</button></div>
          </section>

          <div class="diff-layout">
            <section class="compare-card" aria-label="双栏差异阅读区">
              <div class="compare-head"><div class="pane-head"><span class="pane-label" id="paneLabelA"></span><span class="pane-meta" id="paneMetaA"></span></div><div class="pane-head new"><span class="pane-label new" id="paneLabelB"></span><span class="pane-meta" id="paneMetaB"></span></div></div>
              <div class="compare-body" id="compareBody"></div>
            </section>
            <aside class="side-panel">
              <section class="panel"><div class="panel-title"><span>改动导航</span><button class="panel-link" id="nextChangeBtn">下一个 →</button></div><div class="change-list" id="changeList"></div></section>
              <section class="panel"><div class="panel-title"><span>版本信息</span><button class="panel-link" id="copyBtn">复制链接</button></div><div class="meta-list" id="metaList"></div><div class="panel-callout" style="margin-top:13px"><b>阅读建议：</b>先看上方统计，再用改动导航跳到重点段落。点击任意条目，两栏会定位到对应位置。</div></section>
            </aside>
          </div>
        </div>
      </main>
    </div>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    const versions = {
      V1: { label: 'V1 · 草稿', status: '草稿', date: '2026-08-15 17:48', author: '周齐', chars: '980', tone: 'draft', sections: ['真实性与完整性', '输出结构', '交付标准'] },
      V2: { label: 'V2 · 已发布', status: '已发布', date: '2026-08-21 09:15', author: '张敏', chars: '1,180', tone: 'published', sections: ['真实性与完整性', '输出结构', '交付标准'] },
      V3: { label: 'V3 · 当前发布', status: '当前发布', date: '2026-08-28 14:32', author: '李然', chars: '1,420', tone: 'published', sections: ['真实性与完整性', '输出结构', '风险与注意事项', '交付标准'] }
    };

    const comparisons = {
      'V1-V2': { added: 4, removed: 1, changed: 2, similarity: '79%', rows: [
        { section: '一、真实性与完整性', type: 'context', left: '1. 只能使用原文和证据账本。', right: '1. 只能使用原文和系统提供的证据账本。' },
        { section: '', type: 'changed', left: '2. 保留重要数字和关键表达。', right: '2. 完整保留数字、版本、价格、时间与限制。', note: '修改' },
        { section: '', type: 'added', left: '', right: '3. 合并重复内容时保留新增条件和观点归属。', note: '新增' },
        { section: '二、输出结构', type: 'context', left: '标题、内容概览、核心结论与关键要点。', right: '标题、内容概览、核心结论与关键要点。' },
        { section: '', type: 'removed', left: '按资料出现顺序整理全部内容。', right: '', note: '删除' },
        { section: '', type: 'changed', left: '只输出 Markdown 笔记。', right: '只输出最终 Markdown 笔记，不输出分析过程。', note: '修改' }
      ] },
      'V1-V3': { added: 8, removed: 1, changed: 3, similarity: '71%', rows: [
        { section: '一、真实性与完整性', type: 'changed', left: '1. 只能使用原文和证据账本。', right: '1. 只能使用原文和系统提供的证据账本。', note: '修改' },
        { section: '', type: 'changed', left: '2. 保留重要数字和关键表达。', right: '2. 完整保留数字、版本、价格、时间与限制。', note: '修改' },
        { section: '', type: 'added', left: '', right: '3. 不确定内容标记【待人工确认】。', note: '新增' },
        { section: '二、输出结构', type: 'added', left: '', right: '核心知识体系按知识逻辑完整分组。', note: '新增' },
        { section: '', type: 'removed', left: '按资料出现顺序整理全部内容。', right: '', note: '删除' },
        { section: '三、风险与注意事项', type: 'added', left: '', right: '覆盖风险、误区、边界与原文给出的应对。', note: '新增' },
        { section: '四、交付标准', type: 'changed', left: '只输出 Markdown 笔记。', right: '只输出最终 Markdown 笔记，不输出分析过程。', note: '修改' }
      ] },
      'V2-V3': { added: 7, removed: 3, changed: 2, similarity: '86%', rows: [
        { section: '一、真实性与完整性', type: 'context', left: '1. 只能使用原文和证据账本。', right: '1. 只能使用原文和证据账本。' },
        { section: '', type: 'removed', left: '不得补充原文没有的案例或因果关系。', right: '', note: '删除' },
        { section: '', type: 'added', left: '', right: '不确定内容标记【待人工确认】。', note: '新增' },
        { section: '', type: 'context', left: '2. 完整保留数字、版本、价格、时间与限制。', right: '2. 完整保留数字、版本、价格、时间与限制。' },
        { section: '二、输出结构', type: 'added', left: '', right: '核心知识体系按知识逻辑完整分组。', note: '新增' },
        { section: '', type: 'changed', left: '风险说明表现、影响和应对。', right: '风险说明表现、影响和原文给出的应对。', note: '修改' },
        { section: '三、风险与注意事项', type: 'added', left: '', right: '覆盖风险、误区、边界与原文给出的应对。', note: '新增' },
        { section: '四、交付标准', type: 'changed', left: '只输出 Markdown 笔记。', right: '只输出最终 Markdown 笔记，不输出分析过程。', note: '修改' }
      ] }
    };

    const state = { a: 'V2', b: 'V3', filter: 'all', changedOnly: true, collapsed: false, changeIndex: 0 };
    const $ = (id) => document.getElementById(id);
    const keyFor = () => state.a < state.b ? state.a + '-' + state.b : state.b + '-' + state.a;
    const currentComparison = () => comparisons[keyFor()] || comparisons['V2-V3'];

    function fillVersionSelect(select) {
      select.innerHTML = Object.entries(versions).map(([key, value]) => `<option value="${key}">${value.label}</option>`).join('');
    }

    function renderVersionMeta(side, key) {
      const v = versions[key];
      $(side === 'a' ? 'metaA' : 'metaB').textContent = `${v.date} · ${v.author} · ${v.chars} 字符`;
      const status = $(side === 'a' ? 'statusA' : 'statusB');
      status.textContent = v.status;
      status.className = `pill ${v.tone}`;
      $(side === 'a' ? 'paneLabelA' : 'paneLabelB').textContent = v.label;
      $(side === 'a' ? 'paneMetaA' : 'paneMetaB').textContent = `${v.date} · ${v.chars} 字符`;
    }

    function rowMarkup(row, side, index) {
      const content = side === 'left' ? row.left : row.right;
      const sideType = content ? row.type : 'context';
      const shouldHide = state.changedOnly && sideType === 'context';
      const filterHide = state.filter !== 'all' && sideType !== state.filter && sideType !== 'context';
      const hidden = shouldHide || filterHide || state.collapsed;
      const tag = content && row.note ? `<span class="change-tag">${row.note}</span>` : '';
      return `<div class="diff-row ${sideType} ${hidden ? 'hidden' : ''}" data-row-index="${index}" data-type="${row.type}"><span class="line-no">${index + 1}</span><span class="line-text">${content || ' '}</span>${tag}</div>`;
    }

    function renderDiff() {
      const data = currentComparison();
      const rows = data.rows;
      const left = rows.map((row, i) => `${row.section ? `<div class="section-divider">${row.section}</div>` : ''}${rowMarkup(row, 'left', i)}`).join('');
      const right = rows.map((row, i) => `${row.section ? `<div class="section-divider">${row.section}</div>` : ''}${rowMarkup(row, 'right', i)}`).join('');
      $('compareBody').innerHTML = `<div class="pane">${left || '<div class="empty-state"><strong>两个版本内容一致</strong>没有需要显示的差异。</div>'}</div><div class="pane">${right || '<div class="empty-state"><strong>两个版本内容一致</strong>没有需要显示的差异。</div>'}</div>`;
      const visible = document.querySelectorAll('.diff-row:not(.hidden)').length;
      $('visibleCount').textContent = `显示 ${visible} 处`;
      document.querySelectorAll('.change-item').forEach((item) => item.classList.remove('selected'));
    }

    function renderChangeList() {
      const rows = currentComparison().rows.filter((row) => row.type !== 'context');
      $('changeList').innerHTML = rows.map((row, index) => {
        const kind = row.type === 'added' ? 'add' : row.type === 'removed' ? 'remove' : 'change';
        return `<button class="change-item" data-target-index="${index}"><span class="change-item-title"><span class="change-marker ${kind}"></span>${row.note} · 第 ${index + 1} 处</span><span class="change-item-copy">${row.right || row.left}</span></button>`;
      }).join('');
    }

    function renderMeta() {
      const a = versions[state.a]; const b = versions[state.b];
      $('metaList').innerHTML = `<div class="meta-row"><span>提示词类型</span><strong>学习笔记</strong></div><div class="meta-row"><span>基准版本</span><strong>${a.label}</strong></div><div class="meta-row"><span>目标版本</span><strong>${b.label}</strong></div><div class="meta-row"><span>更新时间</span><strong>${b.date}</strong></div><div class="meta-row"><span>操作者</span><strong>${b.author}</strong></div>`;
    }

    function render() {
      const data = currentComparison();
      $('versionA').value = state.a; $('versionB').value = state.b;
      renderVersionMeta('a', state.a); renderVersionMeta('b', state.b);
      $('contextNote').textContent = `学习笔记 · 当前比较 ${state.a} → ${state.b}`;
      $('summaryTitle').textContent = `${state.a} 与 ${state.b} 的改动`;
      $('summaryCopy').textContent = `基准版本 ${versions[state.a].date} → 目标版本 ${versions[state.b].date}`;
      $('addCount').textContent = data.added; $('removeCount').textContent = data.removed; $('changeCount').textContent = data.changed; $('similarity').textContent = `相似度 ${data.similarity}`;
      renderDiff(); renderChangeList(); renderMeta();
      $('changedOnly').checked = state.changedOnly;
      $('collapseBtn').textContent = state.collapsed ? '+' : '−';
    }

    function toast(message) { const el = $('toast'); el.textContent = message; el.classList.add('show'); clearTimeout(window.__toastTimer); window.__toastTimer = setTimeout(() => el.classList.remove('show'), 2200); }
    function scrollToChange(index) {
      const target = document.querySelector(`[data-row-index="${index}"]`);
      if (target) { target.scrollIntoView({ behavior: 'smooth', block: 'center' }); target.animate([{ outline: '2px solid #2563eb' }, { outline: '2px solid transparent' }], { duration: 900 }); }
    }

    fillVersionSelect($('versionA')); fillVersionSelect($('versionB')); render();
    $('versionA').addEventListener('change', (event) => { state.a = event.target.value; if (state.a === state.b) { state.b = state.a === 'V3' ? 'V2' : 'V3'; toast('两个版本不能相同，已自动调整目标版本。'); } render(); });
    $('versionB').addEventListener('change', (event) => { state.b = event.target.value; if (state.a === state.b) { state.a = state.b === 'V3' ? 'V2' : 'V3'; toast('两个版本不能相同，已自动调整基准版本。'); } render(); });
    $('swapBtn').addEventListener('click', () => { [state.a, state.b] = [state.b, state.a]; render(); toast('已交换基准版本与目标版本。'); });
    document.querySelectorAll('.filter-btn').forEach((button) => button.addEventListener('click', () => { state.filter = button.dataset.filter; document.querySelectorAll('.filter-btn').forEach((item) => item.classList.toggle('active', item === button)); renderDiff(); }));
    $('changedOnly').addEventListener('change', (event) => { state.changedOnly = event.target.checked; renderDiff(); });
    $('collapseBtn').addEventListener('click', () => { state.collapsed = !state.collapsed; renderDiff(); $('collapseBtn').textContent = state.collapsed ? '+' : '−'; });
    $('changeList').addEventListener('click', (event) => { const item = event.target.closest('.change-item'); if (!item) return; const row = currentComparison().rows.filter((entry) => entry.type !== 'context')[Number(item.dataset.targetIndex)]; const index = currentComparison().rows.indexOf(row); state.changedOnly = false; $('changedOnly').checked = false; renderDiff(); scrollToChange(index); });
    $('nextChangeBtn').addEventListener('click', () => { const rows = currentComparison().rows; const changed = rows.map((row, index) => row.type !== 'context' ? index : -1).filter((index) => index > -1); if (!changed.length) return; state.changeIndex = (state.changeIndex + 1) % changed.length; state.changedOnly = false; $('changedOnly').checked = false; renderDiff(); scrollToChange(changed[state.changeIndex]); });
    $('backBtn').addEventListener('click', () => toast('原型演示：这里会返回提示词编辑页，并保留当前比较条件。'));
    $('helpBtn').addEventListener('click', () => toast('先选择两个版本，再用筛选和改动导航快速定位变化。'));
    $('detailsBtn').addEventListener('click', () => toast('原型演示：这里会打开版本详情抽屉。'));
    $('newCompareBtn').addEventListener('click', () => { state.a = 'V1'; state.b = 'V2'; state.filter = 'all'; state.changedOnly = true; document.querySelectorAll('.filter-btn').forEach((item) => item.classList.toggle('active', item.dataset.filter === 'all')); render(); toast('已新建一组比较：V1 → V2。'); });
    $('copyBtn').addEventListener('click', async () => { try { await navigator.clipboard.writeText(`${location.href}#${state.a}-${state.b}`); toast('比较链接已复制。'); } catch { toast('原型演示：已生成当前比较链接。'); } });
  </script>
</body>
</html>
