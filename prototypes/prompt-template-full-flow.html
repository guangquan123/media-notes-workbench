        {section:'三、风险与注意事项',type:'added',left:'',right:'覆盖风险、误区、边界与原文给出的应对。',note:'新增'},
        {section:'四、交付标准',type:'changed',left:'只输出 Markdown 笔记。',right:'只输出最终 Markdown 笔记，不输出分析过程。',note:'修改'}
      ]},
      'V2-V4': { added:9, removed:3, changed:4, similarity:'82%', rows:[
        {section:'一、真实性与完整性',type:'context',left:'1. 只能使用原文和证据账本。',right:'1. 只能使用原文和证据账本。'},
        {type:'removed',left:'不得补充原文没有的案例或因果关系。',right:'',note:'删除'},
        {type:'added',left:'',right:'所有待确认信息必须集中列出并说明原因。',note:'新增'},
        {type:'changed',left:'2. 完整保留数字、版本、价格、时间与限制。',right:'2. 完整保留数字、版本、价格、时间、参数与限制。',note:'修改'},
        {section:'二、输出结构',type:'added',left:'',right:'核心知识体系按知识逻辑完整分组。',note:'新增'},
        {type:'added',left:'',right:'新增“可复用模板”模块，便于直接执行。',note:'新增'},
        {section:'三、风险与注意事项',type:'changed',left:'风险说明表现、影响和应对。',right:'风险说明表现、影响、边界和原文给出的应对。',note:'修改'},
        {section:'四、交付标准',type:'changed',left:'只输出 Markdown 笔记。',right:'只输出最终 Markdown 笔记，不输出分析过程。',note:'修改'}
      ]}
    };
    const state = { view:'overview', template:'study', a:'V2', b:'V3', filter:'all', changedOnly:true, saved:false, published:false, changeIndex:0 };
    const $ = (id) => document.getElementById(id);
    const currentTemplate = () => templates[state.template];
    const diffKey = () => state.a < state.b ? state.a + '-' + state.b : state.b + '-' + state.a;
    const currentDiff = () => diffs[diffKey()] || diffs['V2-V3'];
    function toast(message){const el=$('toast');el.textContent=message;el.classList.add('show');clearTimeout(window.__toast);window.__toast=setTimeout(()=>el.classList.remove('show'),2200)}
    function flow(active){const labels=['选择模板','编辑草稿','发布生效','查看历史','对比差异'];return `<div class="flow">${labels.map((label,index)=>{const n=index+1;const cls=n<active?'done':n===active?'active':'';return `<div class="flow-step ${cls}"><span class="flow-num">${n}</span>${label}</div>`}).join('')}</div>`}
    function commonHead(eyebrow,title,copy,note){return `<div class="page-head"><div><div class="eyebrow">${eyebrow}</div><h1 class="page-title">${title}</h1><p class="page-sub">${copy}</p></div><div class="live-note"><span class="dot"></span>${note}</div></div>`}
    function templateCard(key){const t=templates[key];const selected=state.template===key;return `<button class="template-card ${selected?'selected':''}" data-template="${key}"><span class="template-name">${t.name}</span><span class="template-desc">${t.desc}</span><span class="template-meta"><span>当前发布 ${t.current}</span><span class="status published">已发布</span></span></button>`}
    function renderOverview(){const t=currentTemplate();return `${commonHead('Prompt center','提示词配置','发布中的版本会直接传给 AI；草稿可以反复修改。先从一个提示词类型开始，再决定是否保存或发布。',`${t.name} · 当前发布 ${t.current}`)}${flow(1)}<div class="overview-grid"><section class="panel template-list"><div class="section-label">提示词类型</div><div style="margin-top:12px">${templateCard('study')}${templateCard('meeting')}</div><div class="callout" style="margin-top:14px"><b>从这里开始：</b>点击一个提示词类型，进入编辑和版本管理工作区。</div></section><section class="panel editor"><div class="editor-toolbar"><div class="editor-heading"><span class="editor-title">${t.name}</span><span class="status published">当前发布 ${t.current}</span></div><div class="toolbar-actions"><button class="ghost" id="historyFromOverview">历史版本（${t.history}）</button><button class="primary" id="editFromOverview">进入编辑</button></div></div><div class="editor-body"><div class="editor-summary"><span class="editor-status">当前生效：${t.current} · ${versions[t.current]?.date || '2026-08-28 14:32'}</span><span class="section-label">系统真实性约束仍会保留</span></div><textarea class="editor-text" readonly>${t.intro}\n\n${t.body}</textarea><div class="editor-footer"><span>${t.chars} / 60,000 字符</span><b>发布后才正式生效</b></div></div></section></div>`}
    function renderEditor(){const t=currentTemplate();const currentVersion=state.published?'V4':t.current;return `${commonHead('Prompt center / Edit',`编辑${t.name}`,'先编辑并保存草稿，确认内容后再发布。发布不会删除任何历史版本。',`${t.name} · ${state.saved?'草稿已保存':'未保存修改'}`)}${flow(2)}<section class="panel editor"><div class="editor-toolbar"><div class="editor-heading"><span class="editor-title">${t.name}</span><span class="status ${state.saved?'draft':'published'}">${state.saved?'V4 · 草稿':'当前发布 '+currentVersion}</span></div><div class="toolbar-actions"><button class="ghost" id="historyBtn">历史版本（${t.history + (state.saved?1:0)}）</button><button class="ghost" id="compareFromEditor">对比版本</button><button class="primary" id="publishBtn">发布生效</button></div></div><div class="editor-body"><div class="editor-summary"><span class="editor-status">保存为草稿，发布后才正式传给 AI</span><span class="section-label">最后更新：2026-08-29 10:08</span></div><textarea id="promptEditor" class="editor-text">${t.intro}\n\n${t.body}${state.saved?'\n\n五、可复用模板\n把关键步骤整理成可直接执行的清单。':''}</textarea><div class="editor-footer"><span id="charCount">${state.saved?'1,486':t.chars} / 60,000 字符</span><div><button class="ghost" id="discardBtn">放弃修改</button> <button class="primary" id="saveBtn">保存草稿</button></div></div></div></section>`}
    function versionCard(key){const v=versions[key];const a=state.a===key;const b=state.b===key;return `<div class="version-card ${a?'selected-a':''} ${b?'selected-b':''}"><span class="version-radio">${a?'A':b?'B':'V'}</span><div class="version-main"><div class="version-name">${v.label} ${v.tone==='published'?'<span class="status published">'+v.status+'</span>':'<span class="status draft">草稿</span>'}</div><div class="version-detail">${v.date} · ${v.author} · ${v.chars} 字符</div></div><div class="version-actions"><button class="small-btn ${a?'a':''}" data-pick="a" data-version="${key}">${a?'已选为 A':'选为 A'}</button><button class="small-btn ${b?'b':''}" data-pick="b" data-version="${key}">${b?'已选为 B':'选为 B'}</button></div></div>`}
    function renderHistory(){const t=currentTemplate();const canCompare=state.a!==state.b;return `${commonHead('Prompt center / History','历史版本','版本记录集中管理，选择任意两个版本后进入独立对比页面。草稿和已发布版本都可以参与比较。',`${t.name} · ${t.history + (state.saved?1:0)} 个版本`)}${flow(4)}<div class="history-head"><div><div class="section-label">${t.name} 的全部版本</div><div class="panel-copy" style="margin-top:4px">左侧选择基准版本 A，右侧选择目标版本 B。</div></div><div class="history-actions"><button class="ghost" id="backToEditor">← 返回编辑</button><button class="primary" id="goCompare" ${canCompare?'':'disabled'}>查看差异</button></div></div><div class="history-grid"><section class="panel version-list">${['V4','V3','V2','V1'].map((key)=>key==='V4'&&!state.saved?'':versionCard(key)).join('')}</section><aside class="panel compare-setup"><div class="panel-title">本次比较</div><div class="setup-row"><div class="setup-slot"><strong>比较对象 A</strong><span>${versions[state.a].label}</span></div><div class="setup-slot"><strong>比较对象 B</strong><span>${versions[state.b].label}</span></div></div><div class="setup-hint">${canCompare?'默认按旧版本 → 新版本阅读。进入差异页后可以筛选新增、删除和修改。':'请选择两个不同版本。'}</div><div class="setup-actions"><button class="ghost" id="swapHistory">⇄ 交换</button><button class="primary" id="goCompareSide" ${canCompare?'':'disabled'}>查看差异</button></div></aside></div>`}
    function rowMarkup(row,side,index){const text=side==='left'?row.left:row.right;const type=text?row.type:'context';const hidden=(state.changedOnly&&type==='context')||(state.filter!=='all'&&type!==state.filter&&type!=='context');return `<div class="diff-row ${type} ${hidden?'hidden':''}" data-row-index="${index}"><span class="line-no">${index+1}</span><span class="line-text">${text||' '}</span>${text&&row.note?`<span class="tag">${row.note}</span>`:''}</div>`}
    function renderCompare(){const d=currentDiff();const rows=d.rows;const left=rows.map((r,i)=>`${r.section?`<div class="section-divider">${r.section}</div>`:''}${rowMarkup(r,'left',i)}`).join('');const right=rows.map((r,i)=>`${r.section?`<div class="section-divider">${r.section}</div>`:''}${rowMarkup(r,'right',i)}`).join('');const changes=rows.filter(r=>r.type!=='context');return `${commonHead('Prompt center / Compare',`${state.a} 与 ${state.b} 的改动`,'独立对比工作区保留上下文、版本元信息和筛选条件。确认差异后，可返回编辑继续修改或发布。',`${currentTemplate().name} · ${state.a} → ${state.b}`)}${flow(5)}<div class="compare-layout"><section class="panel compare-card"><div class="compare-head"><div class="pane-head"><span class="pane-label">${versions[state.a].label}</span><span class="pane-meta">${versions[state.a].chars} 字符</span></div><div class="pane-head new"><span class="pane-label new">${versions[state.b].label}</span><span class="pane-meta">${versions[state.b].chars} 字符</span></div></div><div class="compare-body"><div class="pane">${left}</div><div class="pane">${right}</div></div></section><aside class="compare-side"><section class="panel" style="padding:16px"><div class="panel-title">差异摘要</div><div class="stats" style="margin-top:12px"><div class="stat add"><b>${d.added}</b>新增</div><div class="stat remove"><b>${d.removed}</b>删除</div><div class="stat change"><b>${d.changed}</b>修改</div></div><div style="margin-top:11px;color:var(--sub);font-size:10px">相似度 <b style="color:var(--text)">${d.similarity}</b></div><div class="filter-bar"><button class="filter ${state.filter==='all'?'active':''}" data-filter="all">全部差异</button><button class="filter ${state.filter==='added'?'active':''}" data-filter="added">新增</button><button class="filter ${state.filter==='removed'?'active':''}" data-filter="removed">删除</button><button class="filter ${state.filter==='changed'?'active':''}" data-filter="changed">修改</button></div></section><section class="panel" style="padding:16px"><div class="panel-title">改动导航 <button class="panel-link" id="nextChange" style="float:right;border:0;background:none;color:var(--blue);font-size:10px">下一个 →</button></div><div class="change-nav" style="margin-top:12px">${changes.map((r,i)=>`<button class="change-link" data-change-index="${rows.indexOf(r)}"><span class="change-title"><span class="marker ${r.type==='added'?'add':r.type==='removed'?'remove':'change'}"></span>${r.note} · 第 ${i+1} 处</span><span class="change-copy">${r.right||r.left}</span></button>`).join('')}</div></section><section class="panel" style="padding:16px"><div class="panel-title">结束本次操作</div><div class="meta-list" style="margin-top:12px"><div class="meta-row"><span>提示词类型</span><b>${currentTemplate().name}</b></div><div class="meta-row"><span>基准版本</span><b>${versions[state.a].label}</b></div><div class="meta-row"><span>目标版本</span><b>${versions[state.b].label}</b></div></div><div class="callout" style="margin-top:13px"><b>下一步：</b>确认改动后返回编辑页，或返回历史版本重新选择。</div><button class="primary" id="backEditorFromCompare" style="width:100%;margin-top:12px">返回提示词编辑</button></section></aside></div>`}
    function render(){const content=state.view==='overview'?renderOverview():state.view==='editor'?renderEditor():state.view==='history'?renderHistory():renderCompare();$('appContent').innerHTML=content;$('crumbTail').textContent=state.view==='overview'?'/ 总览':state.view==='editor'?'/ 编辑':state.view==='history'?'/ 历史版本':'/ 版本对比';bind();}
    function bind(){document.querySelectorAll('[data-template]').forEach((el)=>el.addEventListener('click',()=>{state.template=el.dataset.template;state.view='editor';state.saved=false;render();}));$('editFromOverview')?.addEventListener('click',()=>{state.view='editor';render()});$('historyFromOverview')?.addEventListener('click',()=>{state.view='history';render()});$('historyBtn')?.addEventListener('click',()=>{state.view='history';render()});$('compareFromEditor')?.addEventListener('click',()=>{state.view='history';render()});$('backToEditor')?.addEventListener('click',()=>{state.view='editor';render()});$('backEditorFromCompare')?.addEventListener('click',()=>{state.view='editor';render()});$('topBack')?.addEventListener('click',()=>{state.view='overview';render();toast('已返回提示词模板总览。')});$('help')?.addEventListener('click',()=>toast('完整路径：选择模板 → 编辑 → 保存草稿 → 发布 → 历史版本 → 对比差异。'));$('saveBtn')?.addEventListener('click',()=>{state.saved=true;toast('草稿已保存为 V4，尚未影响当前生效版本。');render()});$('discardBtn')?.addEventListener('click',()=>{state.saved=false;toast('已放弃未保存修改。');render()});$('publishBtn')?.addEventListener('click',()=>$('publishModal').classList.add('show'));$('cancelPublish')?.addEventListener('click',()=>$('publishModal').classList.remove('show'));$('confirmPublish')?.addEventListener('click',()=>{state.published=true;state.saved=false;$('publishModal').classList.remove('show');toast('发布成功，V4 已成为当前生效版本。');render()});document.querySelectorAll('[data-pick]').forEach((el)=>el.addEventListener('click',()=>{const key=el.dataset.version;if(el.dataset.pick==='a')state.a=key;else state.b=key;if(state.a===state.b)toast('两个比较对象不能相同，请选择另一个版本。');render()}));$('swapHistory')?.addEventListener('click',()=>{[state.a,state.b]=[state.b,state.a];render();toast('已交换比较对象。')});$('goCompare')?.addEventListener('click',()=>{if(state.a===state.b)return toast('请选择两个不同版本。');state.view='compare';render()});$('goCompareSide')?.addEventListener('click',()=>{if(state.a===state.b)return toast('请选择两个不同版本。');state.view='compare';render()});document.querySelectorAll('[data-filter]').forEach((el)=>el.addEventListener('click',()=>{state.filter=el.dataset.filter;render()}));document.querySelectorAll('[data-change-index]').forEach((el)=>el.addEventListener('click',()=>{state.changedOnly=false;render();setTimeout(()=>document.querySelector(`[data-row-index="${el.dataset.changeIndex}"]`)?.scrollIntoView({behavior:'smooth',block:'center'}),30)}));$('nextChange')?.addEventListener('click',()=>{const rows=currentDiff().rows;const indices=rows.map((r,i)=>r.type!=='context'?i:-1).filter((i)=>i>-1);if(!indices.length)return;state.changeIndex=(state.changeIndex+1)%indices.length;state.changedOnly=false;render();setTimeout(()=>document.querySelector(`[data-row-index="${indices[state.changeIndex]}"]`)?.scrollIntoView({behavior:'smooth',block:'center'}),30)});}
    render();
  </script>
</body>
</html>
