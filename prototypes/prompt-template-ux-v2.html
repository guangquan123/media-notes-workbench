n-soft);color:var(--green)}.stat.remove{background:var(--red-soft);color:var(--red)}.stat.change{background:var(--orange-soft);color:var(--orange)}.filter-row{display:flex;gap:7px;flex-wrap:wrap;margin-top:13px}.filter{padding:6px 10px;border:1px solid var(--line-strong);border-radius:999px;background:#fff;color:var(--sub);font-size:10px;font-weight:750}.filter.active{border-color:#111827;background:#111827;color:#fff}.change-nav{display:grid;gap:7px;margin-top:12px}.change-link{width:100%;padding:10px;border:1px solid var(--line);border-radius:9px;background:#fff;text-align:left}.change-link:hover{border-color:#bfd5ff;background:var(--blue-soft)}.change-title{display:flex;align-items:center;gap:6px;font-size:10px;font-weight:800}.marker{width:7px;height:7px;border-radius:50%}.marker.add{background:#34d399}.marker.remove{background:#fb7185}.marker.change{background:#fb923c}.change-copy{display:block;margin-top:4px;color:var(--sub);font-size:10px;line-height:1.4}.side-panel{padding:16px}.side-title{font-size:12px;font-weight:800}.meta-list{display:grid;gap:10px;margin-top:13px}.meta-row{display:flex;justify-content:space-between;gap:12px;color:var(--sub);font-size:10px}.meta-row b{color:var(--text);font-weight:750;text-align:right}.callout{padding:11px 12px;border-radius:9px;background:var(--muted);color:var(--sub);font-size:10px;line-height:1.5}.callout b{color:var(--text)}

  <div class="modal-backdrop" id="publishModal"><div class="modal"><h2>确认发布当前草稿？</h2><p>发布后，V4 将立即成为当前生效版本，并用于后续 AI 笔记生成。历史版本仍会保留。</p><div class="modal-actions"><button class="ghost" id="cancelPublish">取消</button><button class="primary" id="confirmPublish">发布生效</button></div></div></div>

  <script>
    const templates={study:{name:'学习笔记',desc:'适用于课程、书籍、报告、论文、技术资料与系统性复盘。',current:'V3',history:3,chars:'1,420',intro:'目标：把原始材料整理成尽可能详细、准确、可复习、可检索、可复用的学习或培训笔记。',body:'一、真实性与完整性\n1. 只能使用原文和系统提供的证据账本，不得补充原文没有的事实。\n2. 完整保留数字、版本、价格、时间、参数、人名、步骤、条件与限制。\n3. 合并重复内容时必须保留新增条件、观点归属和限制。\n4. 不确定内容标记【待人工确认】。\n\n二、输出结构\n1. 标题：用一句准确、清晰的话概括学习主题。\n2. 内容概览：说明资料性质、核心问题、主要主题及其关系。\n3. 核心知识体系：按知识逻辑完整分组，解释概念、机制、步骤与边界。\n\n三、风险与注意事项\n覆盖风险、误区、适用边界与原文给出的应对。\n\n四、交付标准\n只输出最终 Markdown 笔记，不输出分析过程。'},meeting:{name:'会议纪要',desc:'适用于会议录音、访谈、讨论和项目同步资料。',current:'V2',history:2,chars:'860',intro:'目标：把会议内容整理成可执行、可追踪、可复盘的结构化纪要。',body:'一、会议概览\n1. 记录会议主题、时间、参会人和背景。\n2. 区分事实、观点、决定和待确认信息。\n\n二、讨论与结论\n1. 按议题整理讨论过程和关键分歧。\n2. 明确最终结论、依据和未决问题。\n\n三、行动项\n使用表格列出负责人、截止时间、依赖和验收标准。\n\n四、交付标准\n只输出最终 Markdown 纪要，不输出分析过程。'}};
    const versions={V1:{label:'V1 · 草稿',status:'草稿',date:'2026-08-15 17:48',author:'周齐',chars:'980',tone:'draft'},V2:{label:'V2 · 已发布',status:'已发布',date:'2026-08-21 09:15',author:'张敏',chars:'1,180',tone:'published'},V3:{label:'V3 · 当前发布',status:'当前发布',date:'2026-08-28 14:32',author:'李然',chars:'1,420',tone:'published'},V4:{label:'V4 · 草稿',status:'草稿',date:'2026-08-29 10:08',author:'我',chars:'1,486',tone:'draft'}};

    function pageHead(eyebrow,title,copy,note){return `<div class="page-head"><div><div class="eyebrow">${eyebrow}</div><h1 class="page-title">${title}</h1><p class="page-sub">${copy}</p></div><div class="live-note"><span class="dot"></span>${note}</div></div>`}
    function card(key){const item=templates[key];return `<button class="template-card ${state.template===key?'selected':''}" data-template="${key}"><span class="template-name">${item.name}</span><span class="template-desc">${item.desc}</span><span class="template-meta"><span>当前发布 ${item.current}</span><span class="status published">已发布</span></span></button>`}
    function renderPrompt(){const item=t();const version=activeVersion();const text=`${item.intro}\n\n${item.body}${state.saved?'\n\n五、可复用模板\n把关键步骤整理成可直接执行的清单。':''}`;return `${pageHead('Prompt center','提示词配置','选择提示词类型、编辑并发布，是一条清晰的主任务链。版本管理作为辅助操作，随时可打开、随时可返回。',`${item.name} · ${state.saved?'草稿已保存':'当前发布 '+version}`)}<div class="main-grid"><section class="panel template-list"><div class="section-label">提示词类型</div>${card('study')}${card('meeting')}<div class="template-tip"><b>主任务：</b>先选一个提示词类型，再进入编辑。版本查看和版本比较不会打断这条任务链。</div></section><section class="panel editor"><div class="editor-head"><div class="editor-title"><span class="editor-name">${item.name}</span><span class="status ${state.saved?'draft':'published'}">${state.saved?'V4 · 草稿':'当前发布 '+version}</span></div><div class="action-groups"><div class="action-group"><span class="action-group-label">编辑与发布</span><div class="toolbar-actions">${state.mode==='view'?'<button class="primary" id="editBtn">编辑提示词</button>':'<button class="ghost" id="discardBtn">放弃修改</button><button class="primary" id="saveBtn">保存草稿</button><button class="primary" id="publishBtn">发布生效</button>'}</div></div><div class="action-group"><span class="action-group-label">查看与比较</span><div class="toolbar-actions"><button class="ghost" id="manageBtn">↺ 版本管理</button></div></div></div></div><div class="editor-body"><div class="editor-meta"><span>当前生效：${version} · ${versions[version]?.date||'2026-08-28 14:32'}</span><span>发布后才会传给 AI</span></div>${state.mode==='view'?`<div class="prompt-preview">${text}</div>`:`<textarea class="prompt-editor" id="promptEditor">${text}</textarea>`}<div class="editor-foot"><span>${state.saved?'1,486':item.chars} / 60,000 字符</span><b>系统真实性约束仍会保留</b></div><div class="version-banner"><div><strong>版本管理是独立操作</strong><span>查看历史、选择版本和版本比较都在侧栏完成，不影响当前编辑内容。</span></div><button class="ghost" id="manageBanner">打开版本管理</button></div></div></section></div>`}
    function historyItem(key){const v=versions[key];const isCurrent=key===activeVersion();return `<div class="history-item ${isCurrent?'current':''}"><span class="history-badge">${key}</span><div><div class="history-name">${v.label} ${isCurrent?'<span class="status published">当前生效</span>':''}</div><div class="history-detail">${v.date} · ${v.author} · ${v.chars} 字符</div></div><div class="history-actions"><button class="small-btn" data-pick="a" data-version="${key}">${state.a===key?'A 已选':'选为 A'}</button><button class="small-btn" data-pick="b" data-version="${key}">${state.b===key?'B 已选':'选为 B'}</button></div></div>`}
    function renderDrawer(){const can=state.a!==state.b;const body=state.drawer==='compare'?`<div class="compare-box"><div class="compare-box-title">选择两个版本进行比较</div><div class="compare-grid"><div class="compare-slot"><label for="drawerA">比较对象 A · 基准</label><select id="drawerA">${Object.keys(versions).map((key)=>`<option value="${key}" ${state.a===key?'selected':''}>${versions[key].label}</option>`).join('')}</select></div><div class="compare-slot"><label for="drawerB">比较对象 B · 目标</label><select id="drawerB">${Object.keys(versions).map((key)=>`<option value="${key}" ${state.b===key?'selected':''}>${versions[key].label}</option>`).join('')}</select></div></div><div class="compare-actions"><span class="hint">${can?'默认按旧版本 → 新版本阅读':'请选择两个不同版本'}</span><button class="primary" id="openCompare" ${can?'':'disabled'}>查看差异</button></div></div>`:`<div class="history-list">${['V4','V3','V2','V1'].map((key)=>key==='V4'&&!state.saved?'':historyItem(key)).join('')}</div><div class="compare-box"><div class="compare-box-title">需要比较两个版本？</div><div class="panel-copy">版本比较是独立操作，不会改变当前提示词或编辑状态。</div><div class="compare-actions"><span class="hint">当前选择：${state.a} → ${state.b}</span><button class="ghost" id="drawerCompareTab">进入版本比较</button></div></div>`;return `<div class="drawer-head"><div><div class="drawer-title">版本管理</div><div class="drawer-copy">查看历史版本，或单独发起一次版本比较。</div></div><button class="icon" id="closeDrawer" title="关闭版本管理">×</button></div><div class="drawer-context"><b>当前提示词</b><span>${t().name} · 当前生效 ${activeVersion()}</span></div><div class="tabs"><button class="tab ${state.drawer==='history'?'active':''}" data-drawer-tab="history">历史版本</button><button class="tab ${state.drawer==='compare'?'active':''}" data-drawer-tab="compare">版本比较</button></div>${body}<div class="drawer-footer"><button class="ghost" id="closeDrawerFooter">返回当前提示词</button></div>`}
    function diffRow(row,side,index){const text=side==='left'?row.left:row.right;const type=text?row.type:'context';const hidden=state.filter!=='all'&&type!==state.filter&&type!=='context';return `<div class="diff-row ${type} ${hidden?'hidden':''}" data-row-index="${index}"><span class="line-no">${index+1}</span><span class="line-text">${text||' '}</span>${text&&row.note?`<span class="tag">${row.note}</span>`:''}</div>`}
    function renderCompare(){const rows=diff.rows;const left=rows.map((row,index)=>`${row.section?`<div class="section-divider">${row.section}</div>`:''}${diffRow(row,'left',index)}`).join('');const right=rows.map((row,index)=>`${row.section?`<div class="section-divider">${row.section}</div>`:''}${diffRow(row,'right',index)}`).join('');const changes=rows.filter((row)=>row.type!=='context');return `${pageHead('Prompt center / Compare',`${state.a} 与 ${state.b} 的改动`,'这是独立的查看操作。你可以随时返回当前提示词页面，不会丢失编辑状态或改变发布结果。',`${t().name} · ${state.a} → ${state.b}`)}<div class="compare-layout"><section class="panel compare-card"><div class="compare-head"><div class="pane-head"><span class="pane-label">${versions[state.a].label}</span><span class="pane-meta">${versions[state.a].chars} 字符</span></div><div class="pane-head new"><span class="pane-label new">${versions[state.b].label}</span><span class="pane-meta">${versions[state.b].chars} 字符</span></div></div><div class="compare-body"><div class="pane">${left}</div><div class="pane">${right}</div></div></section><aside class="diff-side"><section class="panel side-panel"><div class="side-title">差异摘要</div><div class="stats" style="margin-top:12px"><div class="stat add"><b>${diff.added}</b>新增</div><div class="stat remove"><b>${diff.removed}</b>删除</div><div class="stat change"><b>${diff.changed}</b>修改</div></div><div class="panel-copy" style="margin-top:11px">相似度 <b style="color:var(--text)">${diff.similarity}</b></div><div class="filter-row"><button class="filter ${state.filter==='all'?'active':''}" data-filter="all">全部差异</button><button class="filter ${state.filter==='added'?'active':''}" data-filter="added">新增</button><button class="filter ${state.filter==='removed'?'active':''}" data-filter="removed">删除</button><button class="filter ${state.filter==='changed'?'active':''}" data-filter="changed">修改</button></div></section><section class="panel side-panel"><div class="side-title">改动导航 <button class="panel-link" id="nextChange" style="float:right;border:0;background:none;color:var(--blue);font-size:10px">下一个 →</button></div><div class="change-nav">${changes.map((row,index)=>`<button class="change-link" data-change-index="${rows.indexOf(row)}"><span class="change-title"><span class="marker ${row.type==='added'?'add':row.type==='removed'?'remove':'change'}"></span>${row.note} · 第 ${index+1} 处</span><span class="change-copy">${row.right||row.left}</span></button>`).join('')}</div></section><section class="panel side-panel"><div class="side-title">返回当前提示词</div><div class="meta-list"><div class="meta-row"><span>提示词类型</span><b>${t().name}</b></div><div class="meta-row"><span>当前生效</span><b>${activeVersion()}</b></div></div><div class="callout" style="margin-top:13px"><b>提醒：</b>版本比较不会改变当前生效版本，也不会自动发布任何内容。</div><button class="primary" id="backPrompt" style="width:100%;margin-top:12px">返回当前提示词</button></section></aside></div>`}
    function render(){const prompt=$('promptPage');const compare=$('comparePage');if(state.view==='prompt'){prompt.classList.remove('hidden');prompt.innerHTML=renderPrompt();compare.classList.remove('active');$('crumbTail').textContent='/ 当前提示词'}else{prompt.classList.add('hidden');compare.classList.add('active');compare.innerHTML=renderCompare();$('crumbTail').textContent='/ 版本比较'}$('drawerBackdrop').classList.toggle('show',!!state.drawer);if(state.drawer)$('drawer').innerHTML=renderDrawer();else $('drawer').innerHTML='';bind()}
    function bind(){document.querySelectorAll('[data-template]').forEach((el)=>el.addEventListener('click',()=>{state.template=el.dataset.template;state.mode='view';state.saved=false;render()}));$('editBtn')?.addEventListener('click',()=>{state.mode='edit';render()});$('saveBtn')?.addEventListener('click',()=>{state.saved=true;toast('草稿已保存，当前发布版本未改变。');render()});$('discardBtn')?.addEventListener('click',()=>{state.mode='view';state.saved=false;toast('已放弃未保存修改。');render()});$('publishBtn')?.addEventListener('click',()=>$('publishModal').classList.add('show'));$('cancelPublish')?.addEventListener('click',()=>$('publishModal').classList.remove('show'));$('confirmPublish')?.addEventListener('click',()=>{state.published=true;state.saved=false;state.mode='view';$('publishModal').classList.remove('show');toast('发布成功，V4 已成为当前生效版本。');render()});$('manageBtn')?.addEventListener('click',()=>{state.drawer='history';render()});$('manageBanner')?.addEventListener('click',()=>{state.drawer='history';render()});$('closeDrawer')?.addEventListener('click',()=>{state.drawer='';render()});$('closeDrawerFooter')?.addEventListener('click',()=>{state.drawer='';render()});document.querySelectorAll('[data-drawer-tab]').forEach((el)=>el.addEventListener('click',()=>{state.drawer=el.dataset.drawerTab;render()}));document.querySelectorAll('[data-pick]').forEach((el)=>el.addEventListener('click',()=>{if(el.dataset.pick==='a')state.a=el.dataset.version;else state.b=el.dataset.version;render()}));$('drawerCompareTab')?.addEventListener('click',()=>{state.drawer='compare';render()});$('drawerA')?.addEventListener('change',(event)=>{state.a=event.target.value;render()});$('drawerB')?.addEventListener('change',(event)=>{state.b=event.target.value;render()});$('openCompare')?.addEventListener('click',()=>{if(state.a===state.b)return toast('请选择两个不同版本。');state.drawer='';state.view='compare';render()});$('backPrompt')?.addEventListener('click',()=>{state.view='prompt';state.drawer='';render();toast('已返回当前提示词页面。')});$('entryBtn')?.addEventListener('click',()=>{state.view='prompt';state.drawer='';render();toast('原型演示：这里会返回应用入口。')});$('helpBtn')?.addEventListener('click',()=>toast('主链路负责编辑与发布；版本管理是随时可打开的独立辅助操作。'));document.querySelectorAll('[data-filter]').forEach((el)=>el.addEventListener('click',()=>{state.filter=el.dataset.filter;render()}));document.querySelectorAll('[data-change-index]').forEach((el)=>el.addEventListener('click',()=>{render();setTimeout(()=>document.querySelector(`[data-row-index="${el.dataset.changeIndex}"]`)?.scrollIntoView({behavior:'smooth',block:'center'}),30)}));$('nextChange')?.addEventListener('click',()=>{const indices=diff.rows.map((row,index)=>row.type!=='context'?index:-1).filter((index)=>index>-1);if(!indices.length)return;state.changeIndex=(state.changeIndex+1)%indices.length;render();setTimeout(()=>document.querySelector(`[data-row-index="${indices[state.changeIndex]}"]`)?.scrollIntoView({behavior:'smooth',block:'center'}),30)})}
    render();
  </script>
</body>
</html>
