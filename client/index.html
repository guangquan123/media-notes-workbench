<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="apple-touch-icon" href="favicon.svg?v=4" />
    <link rel="manifest" href="site.webmanifest?v=4" />
    <meta name="application-name" content="多媒体笔记工作台" />
    <meta name="apple-mobile-web-app-title" content="多媒体笔记工作台" />
    <title>Media Notes Workbench</title>
    <script>
      try {
        window.__platform__ = JSON.parse('{{{__platform__}}}');
      } catch (e) {
        console.error('Failed to parse __platform__', e);
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script>
      (() => {
        const faviconUrl = new URL(
          'favicon.svg?v=4',
          document.baseURI,
        ).toString();
        const faviconLinks = document.querySelectorAll(
          'link[rel="icon"], link[rel="shortcut icon"]',
        );
        faviconLinks.forEach((faviconLink) => {
          faviconLink.href = faviconUrl;
          faviconLink.type = 'image/svg+xml';
        });
      })();
    </script>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
